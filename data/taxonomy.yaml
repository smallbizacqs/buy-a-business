# Each leaf: scope (the boundary a tagger needs), not (neighbouring leaves it is not), aliases (how buyers search),
# volatile: true when the answer depends on rules that change (SBA SOP, rates and fees, tax law, securities rules).
leaves:
  # decide
  - id: buy-vs-start
    topic: decide/buy-vs-build
    question: "Should I buy an existing business or start one?"
    scope: "Acquiring an operating business versus founding a new one: risk, cost, time to cash flow and the work involved."
    not: [buy-vs-franchise, what-is-eta]
    aliases: ["buy a business vs start a business", "acquire or build a company", "is buying a business less risky than starting one"]
  - id: buy-vs-franchise
    topic: decide/buy-vs-build
    question: "Should I buy an independent business, a franchise resale or a new franchise?"
    scope: "Comparing an independent business, the resale of an existing franchise unit and a new franchise unit as ways in; not reviews of particular franchise brands."
    not: [buy-vs-start]
    aliases: ["franchise vs independent business", "buy a franchise resale", "franchise or existing business", "is a franchise worth it"]
  - id: what-is-eta
    topic: decide/buy-vs-build
    question: "What is entrepreneurship through acquisition, and how does the path work?"
    scope: "What entrepreneurship through acquisition means and the steps from search to ownership, as an overview; not choosing among funding paths."
    not: [choose-path, buy-vs-start]
    aliases: ["entrepreneurship through acquisition", "ETA meaning", "what is a searcher", "acquisition entrepreneurship"]
  - id: readiness
    topic: decide/fit
    question: "Am I ready to buy a business: finances, temperament and timing?"
    scope: "Whether a person's savings, credit, risk tolerance, temperament and life timing suit buying now; a self-assessment, not the lender's eligibility test."
    not: [operator-skills, spouse-family, eligibility-credit]
    aliases: ["am I ready to buy a business", "should I buy a business", "signs you're ready to own a business"]
  - id: no-industry-experience
    topic: decide/fit
    question: "Can I buy a business in an industry I've never worked in?"
    scope: "Whether a buyer with no background in the target industry can buy, run and finance it, and how buyers make up for the gap."
    not: [operator-skills, eligibility-credit, license-dependence]
    aliases: ["buy a business with no experience", "no industry experience SBA loan", "buying outside my industry"]
  - id: operator-skills
    topic: decide/fit
    question: "What skills does an owner-operator actually need?"
    scope: "The general management skills an owner-operator uses day to day (people, sales, cash, operations), whatever the industry."
    not: [no-industry-experience, readiness, culture]
    aliases: ["skills to run a small business", "what makes a good owner operator", "do I have what it takes to run a business"]
  - id: career-switch
    topic: decide/fit
    question: "How do people move from banking, tech, consulting or the military into owning a business?"
    scope: "How people leave corporate or military careers for ownership, what carries over and what doesn't."
    not: [mba-path, keep-day-job]
    aliases: ["leave corporate to buy a business", "veteran buying a business", "from tech to business owner", "banker to business owner"]
  - id: mba-path
    topic: decide/fit
    question: "Is buying a business a good path after an MBA, and does the MBA help?"
    scope: "Buying a business during or after an MBA, and what the degree adds or doesn't for searchers, investors and lenders."
    not: [career-switch, traditional-search-fund]
    aliases: ["MBA search fund", "ETA after MBA", "do I need an MBA to buy a business"]
  - id: keep-day-job
    topic: decide/fit
    question: "Can I search for or buy a business while keeping my job?"
    scope: "Searching or owning while employed: time available, how lenders view an outside job, and when buyers usually quit."
    not: [operator-vs-absentee, search-budget]
    aliases: ["buy a business while working full time", "part-time search", "keep my job and buy a business"]
  - id: partner-or-solo
    topic: decide/fit
    question: "Should I search and buy with a partner or alone?"
    scope: "Searching and owning with a co-buyer versus alone, including how partners split equity, roles and decisions."
    not: [co-gp-jv]
    aliases: ["search partner", "buy a business with a partner", "co-searcher", "solo vs partnership acquisition"]
  - id: spouse-family
    topic: decide/fit
    question: "How do I talk through the risk with my spouse and family?"
    scope: "Talking through the money at risk, the personal guarantee and the lifestyle change with a spouse or family."
    not: [personal-guarantee, readiness]
    aliases: ["spouse sign personal guarantee", "spouse support buying a business", "family risk of buying a business"]
  - id: foreign-buyer-visa
    topic: decide/fit
    question: "Can someone who isn't a US citizen buy a US business, and can it lead to a visa?"
    scope: "Ownership and immigration questions for non-US buyers in general; not the SBA's ownership rule."
    not: [citizenship-rule]
    aliases: ["foreign buyer US business", "E-2 visa business purchase", "buy a business on a visa"]
    volatile: true
  - id: operator-vs-absentee
    topic: decide/operator-model
    question: "Should I run the business myself or put in a manager?"
    scope: "The buyer's choice to run the business day to day or hire a general manager, and what each means for price, lending and returns."
    not: [owner-dependence, keep-day-job, hours-lifestyle]
    aliases: ["absentee owner", "semi-absentee business", "hire a general manager", "owner-operator vs investor"]
  - id: hours-lifestyle
    topic: decide/operator-model
    question: "What are the hours and lifestyle like in the first year?"
    scope: "The hours, stress and daily routine of a new owner in the first year."
    not: [operator-vs-absentee, owner-wellbeing]
    aliases: ["how many hours do business owners work", "first year owning a business", "business owner lifestyle"]
  - id: owner-take-home
    topic: decide/economics
    question: "How much will I actually take home after the loan payments?"
    scope: "What the owner keeps each year after loan payments, a salary, taxes and reinvestment in a leveraged deal."
    not: [affordability, j-curve]
    aliases: ["owner salary after SBA loan", "how much do small business owners make", "cash flow after debt service"]
  - id: j-curve
    topic: decide/economics
    question: "How long until the business pays me a normal salary?"
    scope: "How long after closing the owner's pay takes to recover to a normal salary, and why it often dips first."
    not: [owner-take-home]
    aliases: ["j-curve business acquisition", "pay cut after buying a business", "when will I get paid as owner"]
  - id: wealth-building
    topic: decide/economics
    question: "How does owning a small business build long-term wealth?"
    scope: "How ownership builds wealth over years through debt paydown, growth and an eventual sale; the long view, not first-year pay."
    not: [value-creation, exit-options, owner-take-home]
    aliases: ["buy a business to build wealth", "equity from paying down acquisition debt", "small business wealth creation"]
  - id: silver-tsunami
    topic: decide/economics
    question: "Is the wave of retiring owners a real buying opportunity?"
    scope: "Whether retiring baby-boomer owners create more and better-priced deals, and what the evidence says."
    not: [competition-crowded]
    aliases: ["silver tsunami", "baby boomer business owners retiring", "boomer business sell-off"]
  - id: personal-guarantee
    topic: decide/risk
    question: "What does a personal guarantee put at risk, and can I limit it?"
    scope: "What an acquisition loan's personal guarantee exposes, who must sign it, and whether its reach can be limited."
    not: [pg-insurance, collateral-home, asset-protection]
    aliases: ["SBA personal guarantee", "unlimited personal guarantee", "who has to sign the guarantee"]
    volatile: true
  - id: pg-insurance
    topic: decide/risk
    question: "Can I insure my SBA personal guarantee?"
    scope: "Insurance that covers part of a loss under a personal guarantee: what it pays, how it is priced and its limits."
    not: [personal-guarantee, insurance-review]
    aliases: ["personal guarantee insurance", "PG insurance SBA", "insure my personal guarantee"]
  - id: collateral-home
    topic: decide/risk
    question: "Will the lender take my house or other assets as collateral?"
    scope: "Whether and when a lender takes a lien on the buyer's home or other personal assets for an acquisition loan."
    not: [personal-guarantee, asset-protection]
    aliases: ["SBA lien on my house", "SBA loan collateral home", "home as collateral for business loan"]
    volatile: true
  - id: failure-stories
    topic: decide/risk
    question: "What happens when an acquisition fails, and why do they fail?"
    scope: "What happens to the buyer when an acquired business fails (default, guarantee calls, workouts), how often it happens and the broad reasons; operating causes after closing belong to post-close-failure."
    not: [post-close-failure, personal-guarantee]
    aliases: ["what happens if my business fails with an SBA loan", "SBA loan default", "failed acquisition story"]
  - id: asset-protection
    topic: decide/risk
    question: "How do I protect personal assets when I buy a business?"
    scope: "Ways to separate personal assets from business liabilities (entity, insurance, titling), apart from the loan guarantee."
    not: [personal-guarantee, entity-setup, collateral-home]
    aliases: ["protect personal assets LLC", "asset protection business owner", "limit personal liability"]
  - id: boring-business-thesis
    topic: decide/what-to-buy
    question: "Why buy a 'boring' business, and which ones?"
    scope: "The case for unglamorous, essential businesses and the kinds buyers favour."
    not: [resilient-businesses, industry-selection]
    aliases: ["boring businesses to buy", "unsexy businesses", "blue collar business acquisition"]
  - id: resilient-businesses
    topic: decide/what-to-buy
    question: "Which small businesses hold up through recessions and AI?"
    scope: "Which kinds of business hold up in recessions and against substitution by AI, in general; not one target's exposure."
    not: [ai-disruption, boring-business-thesis, macro-exposure]
    aliases: ["recession proof businesses", "AI proof businesses", "businesses that survive downturns"]
  - id: businesses-to-avoid
    topic: decide/what-to-buy
    question: "Which businesses should a first-time buyer avoid?"
    scope: "Kinds of business and business features first-time buyers commonly avoid (fads, heavy capital needs, regulatory traps)."
    not: [early-red-flags, distressed-turnaround]
    aliases: ["worst businesses to buy", "businesses to avoid buying", "bad first acquisition"]
  - id: eta-programs-communities
    topic: decide/learn
    question: "Which programs, conferences and communities about buying a business are worth it?"
    scope: "Programs, courses, conferences and communities for buyers, described by type and what to ask before paying."
    aliases: ["ETA conferences", "search fund community", "business acquisition course"]
  # fund
  - id: self-funded-search
    topic: fund/buyer-path
    question: "How does a self-funded search work?"
    scope: "How a searcher finds and buys one business with their own money, an SBA loan and seller financing, without a fund."
    not: [traditional-search-fund, choose-path]
    aliases: ["self funded searcher", "independent search", "SBA search"]
  - id: traditional-search-fund
    topic: fund/buyer-path
    question: "How does an investor-backed search fund work?"
    scope: "How a traditional search fund raises investor money for the search and then to buy the company, step by step."
    not: [self-funded-search, searcher-economics]
    aliases: ["search fund model", "traditional search fund", "funded search"]
  - id: searcher-economics
    topic: fund/buyer-path
    question: "How does a searcher earn equity in a search fund?"
    scope: "How the searcher's equity is earned and vests in a funded search (tranches, vesting, performance tiers)."
    not: [investor-terms, search-fund-returns]
    aliases: ["searcher carry", "search fund searcher equity", "searcher equity vesting"]
  - id: holdco
    topic: fund/buyer-path
    question: "Should I build a holding company instead of doing one deal?"
    scope: "The starting decision to set up a holding company meant to own several businesses, versus buying one; not how to run one later."
    not: [holdco-operations, rollup-strategy, permanent-capital]
    aliases: ["holding company strategy", "holdco vs single acquisition", "build a holdco"]
  - id: permanent-capital
    topic: fund/buyer-path
    question: "What is permanent capital, and how is buy-and-hold different?"
    scope: "Permanent-capital and buy-and-hold vehicles with no planned sale, and how they differ from fixed-life funds."
    not: [holdco, family-office-capital]
