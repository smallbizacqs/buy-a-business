  - id: choose-path
    topic: fund/buyer-path
    question: "Self-funded, search fund, independent sponsor or holdco: which fits me?"
    scope: "Comparing the main buyer paths side by side to pick one that fits the buyer's money, risk and goals."
    not: [self-funded-search, traditional-search-fund, what-is-eta]
