  - id: micro-pe-lmm
    topic: fund/buyer-path
    question: "How do micro private equity and lower-middle-market funds differ from buying one business?"
    scope: "How micro private equity and lower-middle-market funds buy and run companies, compared with an individual buyer."
    not: [permanent-capital, sell-to-pe]
    aliases: ["micro private equity", "lower middle market PE", "small PE fund vs searcher"]
  - id: family-office-capital
    topic: fund/buyer-path
    question: "How do family offices back buyers and direct deals?"
    scope: "How family offices invest in buyers or in deals directly, and what they look for."
    not: [permanent-capital, what-investors-want]
    aliases: ["family office direct investment", "family office search fund", "family office backing a searcher"]
  - id: sba-7a-basics
    topic: fund/sba-loan
    question: "How does an SBA 7(a) loan to buy a business work?"
    scope: "How a 7(a) loan for a business purchase works end to end: the guaranty, permitted uses and the usual structure."
    not: [underwriting, rates-fees-terms, eligibility-credit]
    aliases: ["SBA 7a loan to buy a business", "SBA acquisition loan", "how SBA loans work"]
    volatile: true
  - id: eligibility-credit
    topic: fund/sba-loan
    question: "Do I qualify for an SBA acquisition loan: credit, experience, liquidity?"
    scope: "Borrower requirements for an SBA acquisition loan: credit history, management experience, liquidity and character."
    not: [underwriting, citizenship-rule, readiness]
    aliases: ["SBA loan requirements", "credit score for SBA loan", "SBA loan eligibility buyer"]
    volatile: true
  - id: equity-injection
    topic: fund/sba-loan
    question: "How much of my own money does an SBA loan require, and what counts toward it?"
    scope: "The SBA's minimum equity injection for a change of ownership and which sources of money count toward it, in general."
    not: [seller-note-as-equity, little-money-down, equity-sources-robs-heloc]
    aliases: ["SBA 10% down", "equity injection SBA", "down payment for SBA loan"]
    volatile: true
  - id: underwriting
    topic: fund/sba-loan
    question: "How do SBA lenders underwrite an acquisition?"
    scope: "The lender's whole review of an acquisition loan (cash flow, borrower, collateral, projections, business quality) and how it decides; the coverage ratio itself is dscr."
