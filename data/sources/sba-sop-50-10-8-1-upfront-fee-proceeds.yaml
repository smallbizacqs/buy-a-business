id: sba-sop-50-10-8-1-upfront-fee-proceeds
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 4: paying the upfront fee from loan proceeds"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The Borrower may use loan proceeds to pay the Upfront Fee; however, the first disbursement may not be made primarily for the purpose of paying the Upfront Fee.
proposition: The borrower may pay the upfront guaranty fee from loan proceeds.
accessed: 2026-11-26
