id: sba-sop-50-10-8-1-agent-definition
tier: primary-rule
title: "SOP 50 10 8.1, Section A: who counts as an Agent"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "SBA defines an “Agent” to mean an authorized representative, including an attorney, accountant, consultant, packager, lender service provider, or any other individual or entity representing an Applicant or participant by conducting business with SBA."
proposition: "For SBA purposes an Agent includes an attorney, accountant, consultant or packager representing the applicant."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
