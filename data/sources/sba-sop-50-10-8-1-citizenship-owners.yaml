id: sba-sop-50-10-8-1-citizenship-owners
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: citizenship and residency requirements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA financing is limited to business Applicants with 100% direct and/or indirect owners and SBA-required guarantors, all of whom must be U.S. Citizens or U.S. Nationals who have their Principal Residence in the United States, its territories, or possessions.
proposition: Every direct and indirect owner and required guarantor of an SBA borrower must be a U.S. citizen or U.S. national whose principal residence is in the United States.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
