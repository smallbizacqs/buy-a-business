id: sba-sop-50-10-8-1-interim-statements
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.b: interim statements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For both an operating Applicant and the acquired business, Lenders must also analyze the most current interim financial statement available along with the comparable interim financial statement from the previous year.
proposition: The lender also compares the latest interim statement with the same period a year earlier.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
