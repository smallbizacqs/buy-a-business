id: sba-sop-50-10-8-1-prepaid-not-equity
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.a: expenses that are not equity"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Expenses related to education, advisory services, or fees paid by the Applicant to an Agent are not eligible prepaid expenses and are not considered equity.
proposition: Education, advisory and agent fees do not count as equity.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
