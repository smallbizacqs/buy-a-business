id: irs-pub-15-successor-w4
tier: official-doc
title: "Publication 15 (Circular E): Forms W-4 from transferred employees"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p15
quote: "If you’re a successor employer (see Successor employer, later in this section), secure new Forms W-4 from the transferred employees unless the “Alternative Procedure” in section 5 of Revenue Procedure 2004-53 applies."
proposition: "A successor employer gets new Forms W-4 from transferred employees unless the alternative procedure in Rev. Proc. 2004-53 applies."
accessed: 2026-11-26
review_by: 2027-02-26
