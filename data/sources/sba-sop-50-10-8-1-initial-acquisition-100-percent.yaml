id: sba-sop-50-10-8-1-initial-acquisition-100-percent
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: Initial Acquisition by a person"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: A Person who is not an existing owner is purchasing 100% of the ownership interest in the small business.
proposition: In an SBA Initial Acquisition by a person who is not an existing owner, the buyer purchases 100% of the business.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
