title: "Choose a business structure: limited liability company"
publisher: U.S. Small Business Administration
url: https://www.sba.gov/business-guide/launch-your-business/choose-business-structure
quote: LLCs protect you from personal liability in most instances, your personal assets — like your vehicle, house, and savings accounts — won’t be at risk in case your LLC faces bankruptcy or lawsuits.
proposition: An LLC generally keeps the owner's personal assets out of reach of the company's creditors and lawsuits, in most instances.
