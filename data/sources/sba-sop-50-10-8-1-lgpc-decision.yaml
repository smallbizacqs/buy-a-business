id: sba-sop-50-10-8-1-lgpc-decision
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 20: non-delegated applications"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "SBA will make the final determination as to the eligibility and creditworthiness of the Applicant, including approving the uses of proceeds, the adequacy of the collateral being pledged, the structure of the loan, and any equity contribution to be required from the Applicant. SBA will either approve or decline the loan in the SBA Loan System."
proposition: "For non-delegated applications sent to SBA's processing center, SBA itself decides eligibility and creditworthiness and approves or declines the loan."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
