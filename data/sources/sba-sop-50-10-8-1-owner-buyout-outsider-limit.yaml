id: sba-sop-50-10-8-1-owner-buyout-outsider-limit
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: owner buyout limit for newcomers"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For all Owner Buyout transactions, individuals not currently employed by the business for a minimum of 24 months may only acquire less than 50% of the total equity and may not become the largest direct or indirect shareholder."
proposition: "In an SBA owner buyout, a person not employed by the business for at least 24 months can buy less than 50% and cannot become the largest shareholder."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
