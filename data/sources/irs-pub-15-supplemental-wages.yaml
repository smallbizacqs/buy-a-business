id: irs-pub-15-supplemental-wages
tier: official-doc
title: "Publication 15 (Circular E): supplemental wages"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p15
quote: Supplemental wages are wage payments to an employee that aren’t regular wages. They include, but aren’t limited to, bonuses, commissions, overtime pay
proposition: Bonuses paid to employees are supplemental wages for federal tax withholding.
accessed: 2026-11-26
