id: sba-sop-50-10-8-1-working-capital-50pct
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: lender’s rationale for working capital"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: When 50 percent or more of the loan proceeds will be used for working capital, Lender must explain in its credit memorandum why this level of working capital is necessary and appropriate for the subject business;
proposition: If half or more of an acquisition loan is working capital, the lender must justify it in the credit memo.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
