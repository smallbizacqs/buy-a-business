id: sba-sop-50-10-8-1-qoe-not-for-seller
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: QoE performed for the lender, not the seller"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The QoE must be performed by an independent, experienced financial professional and must be conducted for the benefit of the Lender. As the QoE report is part of the financial due diligence of the transaction, the report must not be prepared by or for the seller."
proposition: "An SBA-required quality of earnings report must be independent, done for the lender, and not prepared by or for the seller."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
