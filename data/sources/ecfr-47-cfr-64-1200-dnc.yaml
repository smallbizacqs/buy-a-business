id: ecfr-47-cfr-64-1200-dnc
tier: primary-rule
title: "47 CFR 64.1200: Delivery restrictions"
publisher: "Electronic Code of Federal Regulations"
url: https://www.ecfr.gov/current/title-47/part-64/section-64.1200
quote: "A residential telephone subscriber who has registered his or her telephone number on the national do-not-call registry of persons who do not wish to receive telephone solicitations that is maintained by the Federal Government."
proposition: "The FCC's rule bars telephone solicitations to residential subscribers who have registered on the national do-not-call registry."
accessed: 2026-11-26
review_by: 2027-02-26
