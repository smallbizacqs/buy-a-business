id: sba-sop-50-10-8-1-robs-risk
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 2: 401(k) plans including ROBS"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA Lenders must consider that a 401(k) plan sponsor’s failure to administer the plan properly may result in plan disqualification and adverse tax consequences to the plan’s sponsor and its participants, which may impact the Borrower’s ability to repay the loan.
proposition: SBA tells lenders that a badly administered ROBS plan can be disqualified, with adverse tax consequences that may affect repayment.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
