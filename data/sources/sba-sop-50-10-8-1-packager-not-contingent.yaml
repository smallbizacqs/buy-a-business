id: sba-sop-50-10-8-1-packager-not-contingent
tier: primary-rule
title: "SOP 50 10 8.1, Section A: packaging fees"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The Agent may bill and be paid by the Applicant for providing packaging services as long as compensation is reasonable and customary for those services; the compensation complies with SBA Loan Program Requirements; and the compensation is not contingent on the loan being approved or closed."
proposition: "A loan packager paid by the applicant must charge a reasonable, customary fee that is not contingent on the loan being approved or closed."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
