id: ecfr-20-cfr-639-3-employer
tier: primary-rule
title: "20 CFR 639.3(a): WARN definition of employer"
publisher: National Archives, Electronic Code of Federal Regulations
url: https://www.ecfr.gov/current/title-20/chapter-V/part-639/section-639.3
quote: "(i) 100 or more employees, excluding part-time employees; or (ii) 100 or more employees, including part-time employees, who in the aggregate work at least 4,000 hours per week, exclusive of hours of overtime."
proposition: "WARN applies to employers with 100 or more employees excluding part-time workers, or 100 or more including part-time workers who together work at least 4,000 hours a week."
accessed: 2026-11-26
review_by: 2027-11-26
