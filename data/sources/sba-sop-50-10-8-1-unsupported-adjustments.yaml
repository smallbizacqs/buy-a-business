id: sba-sop-50-10-8-1-unsupported-adjustments
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: unsupported adjustments"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Adjustments to cash flow without the Lender's supporting analysis and justification will be ineligible for purposes of determining this core underwriting requirement."
proposition: "Cash flow adjustments the lender has not analyzed and justified don't count toward debt service coverage."
