id: sba-sop-50-10-8-1-express-collateral
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 19: collateral for SBA Express loans"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For SBA Express Loans of $50,000 or less, collateral is not required. For SBA Express Loans greater than $50,000, the Lender must follow the General Requirements in this Appendix but may use its own collateral policies and procedures for similarly sized, non-SBA guaranteed commercial loans in place of SBA's detailed collateral procedures
proposition: An SBA Express loan of $50,000 or less needs no collateral; above that the lender follows SBA’s general collateral requirements but may use its own collateral procedures.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
