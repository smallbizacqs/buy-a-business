id: sba-sop-50-10-8-1-personal-guaranty
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5, Para. A: personal guaranties"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Any individual who has direct and/or indirect ownership of 20% or more of an Applicant must provide an unlimited full guaranty.
proposition: Every individual owning 20% or more of the borrower must give an unlimited full personal guaranty.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
