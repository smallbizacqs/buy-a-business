id: sba-sop-50-10-8-1-conventional-ineligible
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: credit not available elsewhere"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If the Applicant’s cash flow and collateral, including the adequacy of any third party guaranty, would cause the Applicant’s loan to meet conventional credit standards of the SBA Lender or Third Party Lender, the Project is not eligible for an SBA Loan.
proposition: A loan that would meet the lender’s conventional credit standards is not eligible for an SBA guaranty.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
