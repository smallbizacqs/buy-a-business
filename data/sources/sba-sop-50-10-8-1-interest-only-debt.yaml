id: sba-sop-50-10-8-1-interest-only-debt
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.b: interest-only debt in coverage"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: When a change of ownership transaction includes additional debt to support the purchase that is not on full standby and is structured with interest-only payments, the Lender must apply an amortization that does not exceed 10-years.
proposition: For coverage, the lender treats interest-only acquisition debt (such as a seller note not on standby) as if it amortized over no more than 10 years.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
