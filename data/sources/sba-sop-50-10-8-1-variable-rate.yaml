id: sba-sop-50-10-8-1-variable-rate
tier: primary-rule
title: "SOP 50 10 8.1, Section B: variable interest rates"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For variable interest rate loans, the base rate in effect on the first business day of the month will determine the basis for the initial interest rate ... The spread above the base rate as identified in the Note may not be changed during the life of the loan without the written agreement of the Borrower."
proposition: "7(a) loans can carry a variable rate set as a base rate plus a spread that stays fixed for the life of the loan, so the rate follows the base rate."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
