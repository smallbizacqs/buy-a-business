id: sba-sop-50-10-8-1-valuation-gap-equity
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: price above valuation is covered by equity"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The business valuation must support the Business Purchase Price as defined in Paragraph A.1 regardless of how the debt is structured. If the amount paid for the business exceeds the business valuation, the difference must be made up by equity."
proposition: "If the price is higher than the independent business valuation, the difference must come from equity, not more debt."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
