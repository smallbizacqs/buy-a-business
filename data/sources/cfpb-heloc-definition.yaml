id: cfpb-heloc-definition
tier: official-doc
title: "Key terms: home equity line of credit (HELOC)"
publisher: Consumer Financial Protection Bureau
url: https://www.consumerfinance.gov/consumer-tools/mortgages/answers/key-terms/
quote: A home equity line of credit (HELOC) is a line of credit that allows you to borrow against your home equity. ... Unlike a home equity loan, HELOCs usually have adjustable interest rates. ... If you cannot pay back the HELOC, the lender could foreclose on your home.
proposition: A HELOC borrows against home equity, usually at an adjustable rate, and if you cannot repay it the lender could foreclose on your home.
