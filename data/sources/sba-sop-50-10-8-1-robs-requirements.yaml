id: sba-sop-50-10-8-1-robs-requirements
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 2: 401(k) plans including ROBS"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Obtain the full unconditional guaranty of the sponsor(s) of the 401(k) plan regardless of the sponsor’s individual ownership interest in the Applicant concern. ... SBA loan proceeds may not be used for any 401(k) plan formation costs.
proposition: With a ROBS plan the plan sponsor must give a full guaranty, and SBA loan money can’t pay plan setup costs.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
