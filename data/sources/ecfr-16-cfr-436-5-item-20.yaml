id: ecfr-16-cfr-436-5-item-20
tier: primary-rule
title: "16 CFR 436.5(t): Item 20, Outlets and Franchisee Information"
publisher: Federal Trade Commission (eCFR)
url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-D/part-436/section-436.5
quote: Disclose the names of all current franchisees and the address and telephone number of each of their outlets.
proposition: Item 20 of the franchise disclosure document lists current franchisees and their contact details, so a buyer can call them.
