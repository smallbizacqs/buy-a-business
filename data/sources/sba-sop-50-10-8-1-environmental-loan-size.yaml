id: sba-sop-50-10-8-1-environmental-loan-size
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5, Para. E: starting point by loan size"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If the loan amount is up to and including $250,000, the Environmental Investigation may begin with an Environmental Questionnaire. ... If the loan amount is more than $250,000, the Environmental Investigation must, at a minimum, begin with an Environmental Questionnaire and Records Search with Risk Assessment.
proposition: Where no sensitive-industry match applies, a loan up to $250,000 may start with an environmental questionnaire; a larger loan starts at least with a questionnaire plus a records search with risk assessment.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
