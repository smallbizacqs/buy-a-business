id: sba-sop-50-10-8-1-upfront-fee-chart
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: maximum Upfront Fee chart"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: $150,001 to $700,000 (Maturity more than 12 months) 3% of guaranteed portion $700,001 to $5,000,000 (Maturity more than 12 months) (See Note 3) 3.5% of guaranteed portion up to $1,000,000 PLUS 3.75% of the guaranteed portion over $1,000,000
proposition: "The maximum SBA upfront fee chart: 3% of the guaranteed portion for loans of $150,001 to $700,000, and 3.5% of the guaranteed portion up to $1 million plus 3.75% above that for loans of $700,001 to $5 million (maturities over 12 months)."
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
