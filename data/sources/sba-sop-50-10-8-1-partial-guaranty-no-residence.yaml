id: sba-sop-50-10-8-1-partial-guaranty-no-residence
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: two-year guaranty by a selling owner"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA does not require these guarantors that are providing a 2-year guaranty to pledge their personal assets (i.e. Personal residences) in the event of a collateral shortfall.
proposition: A selling owner giving the two-year partial-change guaranty need not pledge a personal residence for a collateral shortfall.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
