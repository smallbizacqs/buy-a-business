id: ecfr-20-cfr-639-4-60-day-notice
tier: primary-rule
title: "20 CFR 639.4: WARN 60-day notice"
publisher: National Archives, Electronic Code of Federal Regulations
url: https://www.ecfr.gov/current/title-20/chapter-V/part-639/section-639.4
quote: "Section 3(a) of WARN states that “an employer shall not order a plant closing or mass layoff until the end of a 60-day period after the employer serves written notice of such an order * * *.”"
proposition: "A WARN-covered employer must give 60 days' written notice before a plant closing or mass layoff."
