id: sba-sop-50-10-8-1-valuation-verified
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.1: verifying valuation data"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Lender must obtain a copy of the financial information relied upon by the individual who performed the business valuation and verify that information against the seller’s IRS transcripts to ensure the accuracy of the information.
proposition: The lender checks the numbers behind the valuation against the seller’s IRS transcripts.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
