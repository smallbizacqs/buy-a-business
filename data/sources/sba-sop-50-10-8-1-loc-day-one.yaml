id: sba-sop-50-10-8-1-loc-day-one
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: line of credit in first lien on trading assets"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Apply no less than 20% and not more than 50% of the day-one line of credit availability to the initial balance on the line of credit. The portion allocated to the line of credit balance must be used to fund the respective portion of the change of ownership transaction.
proposition: If the line takes the first lien on receivables and inventory, 20% to 50% of its day-one availability must be drawn to fund part of the purchase.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
