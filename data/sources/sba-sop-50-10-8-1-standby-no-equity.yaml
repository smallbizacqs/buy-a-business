id: sba-sop-50-10-8-1-standby-no-equity
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: standby debt agreements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The provider of standby debt may not take an equity investment in the business.
proposition: A lender whose debt is on SBA full standby may not also take equity in the business.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
