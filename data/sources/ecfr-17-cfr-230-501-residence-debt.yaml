id: ecfr-17-cfr-230-501-residence-debt
tier: primary-rule
title: "17 CFR 230.501(a)(5)(i)(B): mortgage debt on the primary residence"
publisher: U.S. Securities and Exchange Commission (eCFR)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: Indebtedness that is secured by the person's primary residence, up to the estimated fair market value of the primary residence at the time of the sale of securities, shall not be included as a liability (except that if the amount of such indebtedness outstanding at the time of sale of securities exceeds the amount outstanding 60 days before such time, other than as a result of the acquisition of the primary residence, the amount of such excess shall be included as a liability)
proposition: For the net worth test, debt secured by the primary residence up to its value is not a liability, except that an increase in that debt in the 60 days before the sale counts as a liability.
accessed: 2026-11-26
