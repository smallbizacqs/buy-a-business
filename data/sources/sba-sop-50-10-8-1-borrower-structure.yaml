id: sba-sop-50-10-8-1-borrower-structure
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: who borrows in a stock purchase"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "A Person who is not an existing owner is purchasing 100% of the ownership interest in the small business. The small business and the Person who is acquiring the ownership interest must be Co-Borrowers."
proposition: "When a new owner buys 100% of a business's stock or units with a 7(a) loan, the business and the buyer are co-borrowers."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
