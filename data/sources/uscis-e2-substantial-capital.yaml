id: uscis-e2-substantial-capital
tier: official-doc
title: "E-2 Treaty Investors: substantial amount of capital"
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-2-treaty-investors
quote: "A substantial amount of capital is: Substantial in relationship to the total cost of either purchasing an established enterprise or establishing a new one"
proposition: For E-2 purposes, whether an investment is substantial is judged against the total cost of buying an established business or starting a new one.
accessed: 2026-11-26
