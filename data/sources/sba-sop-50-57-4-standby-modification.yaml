id: sba-sop-50-57-4-standby-modification
tier: primary-rule
title: "SOP 50 57 4, Ch. 10: standby agreements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Lenders should not terminate nor modify a standby agreement required by the Loan Documents, to allow a Borrower to make full or partial payments to the standby creditor, unless Prudent Servicing practices would support doing so. ... Lenders must not terminate or modify the standby agreement unless the proposed termination or modification is permitted by the applicable Loan Program Requirements in SOP 50 10 in effect when the Loan was approved.
proposition: A lender should not loosen a standby agreement to allow payments to the standby creditor without a prudent basis, and a standby used as equity injection can be changed only if the SOP 50 10 in effect at approval allows it.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
