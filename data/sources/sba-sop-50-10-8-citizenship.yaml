id: sba-sop-50-10-8-citizenship
tier: primary-rule
title: "SOP 50 10 8 (effective June 1, 2025): businesses owned by non-U.S. citizens"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-05/SOP%2050%2010%208%20Technical%20Updates%20effective%206.1.2025.docx
quote: SBA financing is limited to businesses with 100% direct and/or indirect owners and SBA-required guarantors (except as noted below) that are U.S. citizens, U.S. Nationals, or who are Lawful Permanent Residents (LPRs) (commonly referred to as “green card holders”), and comply with the requirements in this Paragraph.
proposition: Under SOP 50 10 8, all owners had to be U.S. citizens, U.S. nationals or lawful permanent residents.
accessed: 2026-11-26
review_by: 2027-02-26
notes: Superseded by SOP 50 10 8.1 for loans numbered on or after 2026-10-01; cited for the history of the rule.
