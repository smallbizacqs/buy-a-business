id: sba-sop-50-10-8-1-environmental-phase-i-naics
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5, Para. E: environmentally sensitive industries"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If there is a NAICS code match to an environmentally sensitive industry identified in Appendix 6, the Environmental Investigation must begin with a Phase I, regardless of the amount of the loan.
proposition: If the property’s current or known prior use matches an environmentally sensitive industry on SBA’s list, the investigation must start with a Phase I, whatever the loan size.
