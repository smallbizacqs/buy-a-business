id: ecfr-17-cfr-230-501-accredited-net-worth
tier: primary-rule
title: "17 CFR 230.501: Accredited investor: net worth"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: Any natural person whose individual net worth, or joint net worth with that person's spouse or spousal equivalent, exceeds $1,000,000;
proposition: A natural person with net worth over $1 million (alone or with a spouse or spousal equivalent) is an accredited investor.
accessed: 2026-11-26
