id: sba-sop-50-10-8-1-small-express-lender-documents
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: lender forms and procedures for 7(a) Small and SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: To the maximum extent practicable, 7(a) Small and SBA Express Lenders may use their own forms, internal credit memoranda, notes, collateral documents, and servicing and liquidation documentation.
proposition: 7(a) Small and SBA Express lenders may largely use their own forms, credit memos, notes, collateral documents and servicing documents.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
