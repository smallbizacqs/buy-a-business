id: sba-sop-50-10-8-1-extra-equity-dsc
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: more equity to meet coverage"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Applicant may contribute additional unlimited or limited equity to reduce the loan amount and corresponding debt service in order to meet the DSC requirement."
proposition: "A buyer may put in more equity to shrink the loan and its payments so the deal meets the coverage requirement."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
