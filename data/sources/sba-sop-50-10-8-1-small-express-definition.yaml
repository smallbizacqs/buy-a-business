id: sba-sop-50-10-8-1-small-express-definition
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: 7(a) Small and SBA Express defined"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: 7(a) Small loans are term (non-revolving) 7(a) loans that are $350,000 or less. ... SBA Express loans are loans that are $500,000 or less and may only be made by a Lender with SBA Express authority.
proposition: 7(a) Small loans are term loans of $350,000 or less, and SBA Express loans are loans of $500,000 or less made only by lenders with SBA Express authority.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
