id: ecfr-16-cfr-436-5-item-20-former
tier: primary-rule
title: "16 CFR 436.5(t)(5): Item 20, former franchisees"
publisher: Federal Trade Commission (eCFR)
url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-D/part-436/section-436.5
quote: Disclose the name, city and state, and current business telephone number, or if unknown, the last known home telephone number of every franchisee who had an outlet terminated, canceled, not renewed, or otherwise voluntarily or involuntarily ceased to do business under the franchise agreement during the most recently completed fiscal year
proposition: Item 20 also lists franchisees who left the system in the last fiscal year, with contact details.
accessed: 2026-11-26
review_by: 2027-11-26
