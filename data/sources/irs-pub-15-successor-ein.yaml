id: irs-pub-15-successor-ein
tier: official-doc
title: "Publication 15 (Circular E), Employer’s Tax Guide: EIN after taking over a business"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p15
quote: "If you took over another employer’s business (see Successor employer in section 9), don’t use that employer’s EIN."
proposition: "A buyer that takes over another employer's business does not use the seller's employer identification number."
accessed: 2026-11-26
review_by: 2027-02-26
