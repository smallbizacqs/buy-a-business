id: sba-sop-50-57-4-management-covenants
tier: primary-rule
title: "SOP 50 57 4, Ch. 10: management covenants"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Lenders should not modify management covenants in the Loan Documents pertaining to matters such as limitations on compensation, fixed assets, working capital levels, or dividend payments unless such modifications are supported by Prudent Servicing practices.
proposition: Loan documents can limit compensation, fixed asset purchases, working capital levels and dividends, and lenders should not modify those covenants without a prudent basis.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
