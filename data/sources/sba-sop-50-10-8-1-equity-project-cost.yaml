id: sba-sop-50-10-8-1-equity-project-cost
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.a: equity based on total project cost"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA requires equity injections (Applicant contribution) for change of ownership transactions to be based on the total project cost (all costs required to become operational, regardless of the source of funds, except for lines of credit and 504 loans).
proposition: The equity injection is measured against total project cost, not just the purchase price.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
