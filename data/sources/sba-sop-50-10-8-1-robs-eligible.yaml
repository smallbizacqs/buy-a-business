id: sba-sop-50-10-8-1-robs-eligible
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 2: 401(k) plans including ROBS"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: A business that is owned in whole or in part by a 401(k) plan (including a Rollovers as Business Startups (ROBS) plan) may be eligible provided the SBA Lender complies with the requirements in this section and the plan complies with all applicable IRS, Treasury, and Department of Labor requirements.
proposition: A business owned by a ROBS plan may get an SBA loan if the plan complies with IRS, Treasury and Labor rules.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
