id: sba-sop-50-10-8-1-rent-addback
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: historical debt service coverage"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Lenders may include an addback for rent payments when the owner-occupied commercial real estate is part of the transaction.
proposition: When the building is bought in the deal, the lender may add the old rent back to cash flow for coverage.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
