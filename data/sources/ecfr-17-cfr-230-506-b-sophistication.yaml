id: ecfr-17-cfr-230-506-b-sophistication
tier: primary-rule
title: "17 CFR 230.506: Rule 506(b) nature of purchasers"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.506
quote: Each purchaser who is not an accredited investor either alone or with his purchaser representative(s) has such knowledge and experience in financial and business matters that he is capable of evaluating the merits and risks of the prospective investment
proposition: Each non-accredited purchaser in a Rule 506(b) offering must be financially sophisticated, alone or with a representative.
accessed: 2026-11-26
