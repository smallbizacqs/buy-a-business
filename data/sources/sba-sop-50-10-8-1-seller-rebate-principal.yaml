id: sba-sop-50-10-8-1-seller-rebate-principal
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: seller rebates go to principal"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "If the Borrower receives funds based on a rebate from the seller, proceeds must be applied to pay down the principal balance of the 7(a) loan that funded the change of ownership."
proposition: "A rebate the buyer receives from the seller must be used to pay down the 7(a) loan that funded the purchase."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
