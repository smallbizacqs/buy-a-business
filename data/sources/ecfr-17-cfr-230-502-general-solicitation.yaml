id: ecfr-17-cfr-230-502-general-solicitation
tier: primary-rule
title: "17 CFR 230.502: Limitation on manner of offering"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.502
quote: Except as provided in § 230.504(b)(1) or § 230.506(c), neither the issuer nor any person acting on its behalf shall offer or sell the securities by any form of general solicitation or general advertising
proposition: Outside Rule 506(c) (and a narrow Rule 504 case), a Regulation D issuer may not use general solicitation or advertising.
accessed: 2026-11-26
