title: "Instructions for Form 8594: penalties"
publisher: Internal Revenue Service
url: https://www.irs.gov/instructions/i8594
quote: If you do not file a correct Form 8594 by the due date of your return and you cannot show reasonable cause, you may be subject to penalties.
proposition: Failing to file a correct Form 8594 on time without reasonable cause can bring penalties.
