id: sba-sop-50-10-8-1-real-estate-equity
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: equity for real estate in a change of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Real estate purchased in conjunction with a change of ownership transaction is also subject to the same equity injection requirements. When separated into two loans, the Lender must allocate the equity contribution on a pro-rata basis; however, if the real estate is financed with a 504 loan, the equity injection applicable to the 504 loan must comply with the equity injection requirements for the 504 Loan Program.
proposition: Real estate bought with an SBA acquisition carries the same equity requirement, allocated pro rata across separate loans, unless it is a 504 loan, which follows 504 rules.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
