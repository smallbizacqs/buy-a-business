id: sba-sop-50-10-8-1-owner-buyout-outsider-consequence
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: Owner Buyout that exceeds the limit"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Transactions that do not meet this requirement must be processed following the requirements in Para. C. Credit Standards in Appendix 15 for Initial Acquisition (specifically the minimum DSC, minimum equity injection and Quality of Earnings requirements).
proposition: "An owner buyout that breaks the under-50% limit for newcomers is underwritten to Initial Acquisition standards: minimum coverage, minimum equity and the QoE requirement."
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
