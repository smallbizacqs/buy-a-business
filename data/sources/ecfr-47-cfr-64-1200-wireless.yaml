id: ecfr-47-cfr-64-1200-wireless
tier: primary-rule
title: "47 CFR 64.1200: Delivery restrictions"
publisher: "Electronic Code of Federal Regulations"
url: https://www.ecfr.gov/current/title-47/part-64/section-64.1200
quote: "The rules set forth in paragraph (c) and (d) of this section are applicable to any person or entity making telephone solicitations or telemarketing calls or text messages to wireless telephone numbers"
proposition: "The FCC's do-not-call rules also apply to telephone solicitations and telemarketing calls or texts to wireless numbers."
