id: sba-sop-50-10-8-1-price-above-valuation-standby
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: extra funds when price exceeds valuation"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Additional Limited Equity Sources may be used when additional funds are required to supplement the purchase when the sales price exceeds the value supported by the Business Valuation and Quality of Earnings report. In this situation, any additional funds provided must be on full standby."
proposition: "When the price exceeds the value supported by the valuation and QoE, extra limited-source funds may fill the gap but must be on full standby."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
