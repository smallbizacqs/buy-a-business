id: sba-sop-50-10-8-1-express-non-financial-default
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: SBA Express non-financial default provisions"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Non-financial default provisions are loan conditions that, if violated, would cause the loan to be in default even though the Borrower has made all payments as agreed. ... A lender may not request purchase of the guaranty solely based on a violation of a non-financial default provision
proposition: A non-financial default provision puts a loan in default even when every payment has been made, though the lender cannot ask SBA to honor the guaranty on that ground alone.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
