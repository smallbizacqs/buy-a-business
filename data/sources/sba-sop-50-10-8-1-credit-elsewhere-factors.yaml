id: sba-sop-50-10-8-1-credit-elsewhere-factors
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: acceptable credit-elsewhere factors"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The business needs a longer maturity than the SBA Lender’s/Third Party Lender’s policy permits to reasonably assure the ability of the loan applicant to repay the debt from the actual or projected cash flow of the business
proposition: Needing a longer maturity than the lender’s conventional policy allows is an accepted reason credit is not available elsewhere.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
