id: sba-sop-50-10-8-1-dsc-ratio
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15 (7(a) Changes of Ownership), Para. C.2: debt service coverage"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The Debt Service Coverage (DSC) ratio must be satisfied using either the last fiscal year-end or an average of the last two fiscal year-end statements on either a historical or adjusted basis based on the transaction type: Initial Acquisition: 1.25:1 Business Expansion: 1.15:1 Owner Buyout: 1.25:1 ESOP and Cooperative: 1.25:1"
proposition: "For a 7(a) change of ownership, the lender tests debt service coverage on the last fiscal year-end or the average of the last two, at 1.25:1 for an initial acquisition or owner buyout and 1.15:1 for a business expansion."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01."
