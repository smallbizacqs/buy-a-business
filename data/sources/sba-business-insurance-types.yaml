id: sba-business-insurance-types
tier: official-doc
title: "SBA business guide: Get business insurance (common types)"
publisher: U.S. Small Business Administration
url: https://www.sba.gov/business-guide/launch-your-business/get-business-insurance
quote: General liability insurance Any business This coverage protects against financial loss as the result of bodily injury, property damage, medical expenses, libel, slander, defending lawsuits, and settlement bonds or judgments. ... Professional liability insurance Businesses that provide services to customers This coverage protects against financial loss as a result of malpractice, errors, and negligence.
proposition: SBA describes general liability insurance as coverage for any business and professional liability insurance as coverage for businesses that provide services.
