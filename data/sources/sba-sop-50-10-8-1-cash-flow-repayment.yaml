id: sba-sop-50-10-8-1-cash-flow-repayment
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: credit analysis and repayment from cash flow"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The cash flow of the Applicant is the primary source of repayment, not any expected recovery from the liquidation of collateral. Thus, if the Lender’s financial analysis demonstrates that the Applicant lacks reasonable assurance of repayment in a timely manner from the cash flow of the business, the loan request must be declined, regardless of the collateral available or outside sources of repayment.
proposition: An SBA loan must be repaid from the business's cash flow; the lender must decline a loan the cash flow cannot support, whatever the collateral.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
