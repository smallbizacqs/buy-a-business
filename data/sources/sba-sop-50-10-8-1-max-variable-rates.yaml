id: sba-sop-50-10-8-1-max-variable-rates
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 18: allowable spreads over the base rate"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The allowable spread when using the base rate (i.e., prime rate or SBA Optional Peg) is determined by the loan amount. Loans of $50,000 and less: Base rate + 6.5%; Loans of $50,001 up to and including $250,000: Base rate + 6%; Loans of $250,001 up to and including $350,000: Base rate + 4.5%; Loans of $350,001 and higher: Base rate + 3%."
proposition: The maximum variable 7(a) rate is the base rate plus a spread set by loan size, from 6.5% for loans of $50,000 or less down to 3% for loans over $350,000.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
