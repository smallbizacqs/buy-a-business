id: sba-sop-50-10-8-1-real-estate-appraisal
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: real estate appraisal"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: When real estate is part of the acquisition, a commercial real estate appraisal must meet the requirements in Appendix 19, Para. A.1.g. Commercial real estate appraisal requirements.
proposition: Real estate in an SBA acquisition needs a commercial real estate appraisal meeting SBA requirements.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
