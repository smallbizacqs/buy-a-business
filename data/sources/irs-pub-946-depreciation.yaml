id: irs-pub-946-depreciation
tier: official-doc
title: "Publication 946, How To Depreciate Property"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p946
quote: "Depreciation is an annual income tax deduction that allows you to recover the cost or other basis of certain property over the time you use the property. It is an allowance for the wear and tear, deterioration, or obsolescence of the property."
proposition: "Depreciation spreads the cost of business property over the years it is used, as an allowance for wear and tear."
accessed: 2026-11-26
