id: sba-sop-50-57-4-deferment
tier: primary-rule
title: "SOP 50 57 4, Ch. 12: deferments"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: If the Borrower's cash flow problem is temporary, Lenders may defer (i.e., postpone without accelerating the Note or transferring the Loan into liquidation status) any delinquent payments, as well as full or partial future monthly payments for a 7(a) Loan, for a stated period of time. ... Generally, interest will continue to accrue during the deferment period.
proposition: For a temporary cash flow problem, a lender may defer 7(a) payments for a stated period, generally with interest still accruing.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
