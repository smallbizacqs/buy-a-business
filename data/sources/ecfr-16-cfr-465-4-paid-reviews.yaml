id: ecfr-16-cfr-465-4-paid-reviews
tier: primary-rule
title: "16 CFR 465.4: buying positive or negative consumer reviews"
publisher: National Archives, Electronic Code of Federal Regulations
url: https://www.ecfr.gov/current/title-16/part-465/section-465.4
quote: It is an unfair or deceptive act or practice and a violation of this part for a business to provide compensation or other incentives in exchange for, or conditioned expressly or by implication on, the writing or creation of consumer reviews expressing a particular sentiment, whether positive or negative, regarding the product, service, or business that is the subject of the review.
proposition: A business may not pay or give incentives for reviews conditioned on a positive or negative sentiment.
accessed: 2026-11-26
