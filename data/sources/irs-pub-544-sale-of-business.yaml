id: irs-pub-544-sale-of-business
tier: official-doc
title: "Publication 544, Sales and Other Dispositions of Assets: sale of a business"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p544
quote: The sale of a business is usually not a sale of one asset. Instead, all the assets of the business are sold. Generally, when this occurs, each asset is treated as being sold separately for determining the treatment of gain or loss. ... The sale of inventory results in ordinary income or loss.
proposition: In a sale of a business’s assets, each asset is generally treated as sold separately for tax purposes, and the sale of inventory produces ordinary income or loss.
accessed: 2026-11-26
review_by: 2027-02-26
