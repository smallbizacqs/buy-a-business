id: sba-sop-50-10-8-1-occupancy
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 3: occupancy requirements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For an existing building, the Applicant must occupy 51% of the Rentable Property and may lease to a third party up to 49%;
proposition: To finance an existing building with an SBA loan, the business must occupy at least 51% of it and may lease out up to 49%.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
