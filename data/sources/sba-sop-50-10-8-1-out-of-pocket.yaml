id: sba-sop-50-10-8-1-out-of-pocket
tier: primary-rule
title: "SOP 50 10 8.1, Section A: out-of-pocket expenses"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The Lender may collect from the Applicant necessary out-of-pocket expenses such as filing or recording fees, photocopying, delivery charges, collateral appraisals and environmental investigation reports that are obtained in compliance with SBA policy, and other direct charges related to loan closing."
proposition: "A 7(a) lender may pass the borrower necessary out-of-pocket closing costs such as filing fees, collateral appraisals and environmental reports."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
