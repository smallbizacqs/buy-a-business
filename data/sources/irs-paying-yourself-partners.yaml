id: irs-paying-yourself-partners
tier: official-doc
title: "Paying yourself: partners"
publisher: Internal Revenue Service
url: https://www.irs.gov/businesses/small-businesses-self-employed/paying-yourself
quote: Partners are not employees and should not be issued a Form W-2, Wage and Tax Statement, in lieu of Form 1065, Schedule K-1, for distributions or guaranteed payments from the partnership.
proposition: "How an owner is paid, and taxed, depends on the entity: partners take distributions or guaranteed payments, not W-2 wages."
accessed: 2026-11-26
review_by: 2027-02-26
