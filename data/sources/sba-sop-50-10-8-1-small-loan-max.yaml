id: sba-sop-50-10-8-1-small-loan-max
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: 7(a) Small maximum loan amount"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: 7(a) Small loans have a maximum loan amount of $350,000 per project (including other 7(a) loans made within 90 days). ... If the 7(a) Small loan is increased above $350,000, it becomes a Standard 7(a) loan and must follow the requirements in Chapter 1 of this section.
proposition: A 7(a) Small loan is capped at $350,000 per project, counting other 7(a) loans made within 90 days, and becomes a Standard 7(a) loan if increased above that.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
