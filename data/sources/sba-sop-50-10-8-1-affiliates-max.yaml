id: sba-sop-50-10-8-1-affiliates-max
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: affiliates and loan maximums"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If affiliation exists, SBA’s loan maximums apply to the Applicant, including all affiliates, as if all were a single business.
proposition: SBA loan maximums apply to a borrower and its affiliates together.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
