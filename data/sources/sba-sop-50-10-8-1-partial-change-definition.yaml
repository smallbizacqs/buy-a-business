id: sba-sop-50-10-8-1-partial-change-definition
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: Owner Buyout, Partial Change of Owner"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Partial Change of Owner: Loan proceeds may be used to fund the purchase of all or a portion of one or more owner’s interest in the business or of the business itself (e.g., the purchase of treasury stock or membership units) and where at least one of the original owners remains as an owner after the sale and personally guarantees the loan."
proposition: A 7(a) loan can fund buying part of an owner’s interest when at least one original owner stays as an owner and guarantees the loan.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
