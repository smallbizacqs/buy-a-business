id: sba-sop-50-10-8-1-total-debt-cap
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: total debt limited to the valuation"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The total debt eligible to support a change of ownership transaction (including seller debt that is not on full standby) is limited to the business valuation amount and must be supported by the Debt Service Coverage of the Applicant."
proposition: "All debt in an SBA acquisition, including seller debt not on full standby, is capped at the business valuation and must be covered by cash flow."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
