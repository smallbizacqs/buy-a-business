id: ecfr-16-cfr-255-1-endorsements
tier: primary-rule
title: "16 CFR 255.1: endorsements must be honest"
publisher: National Archives, Electronic Code of Federal Regulations
url: https://www.ecfr.gov/current/title-16/part-255/section-255.1
quote: Endorsements must reflect the honest opinions, findings, beliefs, or experience of the endorser.
proposition: Under the FTC endorsement guides, endorsements used in advertising must reflect the endorser’s honest opinions or experience.
accessed: 2026-11-26
review_by: 2027-02-26
