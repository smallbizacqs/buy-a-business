id: irs-irm-4-48-4-valuation-factors
tier: official-doc
title: "Internal Revenue Manual 4.48.4, Business Valuation Guidelines: discount and capitalization rate factors"
publisher: Internal Revenue Service
url: https://www.irs.gov/irm/part4/irm_04-048-004
quote: "The appraiser will determine an appropriate discount and/or capitalization rate after taking into consideration all relevant factors such as: The nature of the business The risk involved The company's industry The stability or irregularity of earnings"
proposition: "The IRS's valuation guidelines tie the discount or capitalization rate to the nature of the business, its risk, its industry and the stability of its earnings."
