id: sba-sop-50-10-8-1-site-visit
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. A: site visit"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: A site visit for the Applicant and for the business being acquired. The Lender must document in its loan file the date of the site visit as well as comments.
proposition: The lender must make and document a site visit to the business being acquired.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
