id: sba-sop-50-10-8-1-combined-size
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: size standards"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For 7(a) and 504 loans involving a business acquisition or change of ownership, the combined size of the Applicant and the acquired business must meet applicable size standards.
proposition: In an SBA acquisition, the buyer and the acquired business together must be small under SBA size standards.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
