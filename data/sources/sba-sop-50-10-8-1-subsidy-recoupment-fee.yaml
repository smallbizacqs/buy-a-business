id: sba-sop-50-10-8-1-subsidy-recoupment-fee
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: Subsidy Recoupment Fee"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For loans with a maturity of 15 years or longer, the Borrower must pay to SBA a Subsidy Recoupment Fee when the Borrower voluntarily prepays more than 25% of its loan in any 1 year during the first 3 years after first disbursement. The fee is 5% of the prepayment amount during the first year, 3% the second year, and 1% in the third year.
proposition: On 7(a) loans of 15 years or longer, prepaying more than 25% in a year during the first three years triggers an SBA fee of 5%, 3% or 1%.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
