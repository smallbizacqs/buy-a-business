id: sba-sop-50-57-4-acceleration
tier: primary-rule
title: "SOP 50 57 4, Ch. 15: acceleration"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Lenders do not have a legal right to accelerate, make demand, or liquidate the collateral unless there has been a Default on the Note.
proposition: A lender cannot accelerate a 7(a) loan or liquidate collateral unless there has been a default under the note.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
