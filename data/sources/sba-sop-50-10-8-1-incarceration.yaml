id: sba-sop-50-10-8-1-incarceration
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: ineligible businesses (associates incarcerated or indicted)"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Businesses with an Associate who is currently incarcerated, serving a sentence of imprisonment imposed upon adjudication of guilty, or is under indictment for a felony or any crime involving or relating to financial misconduct or a false statement are ineligible. A business that is owned by an individual(s) who is currently on parole or probation may be eligible
proposition: A business is ineligible if an associate is incarcerated or under felony or financial-misconduct indictment; an owner on parole or probation may be eligible.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
