id: uscis-e2-qualifications
tier: official-doc
title: E-2 Treaty Investors
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-2-treaty-investors
quote: "To qualify for E-2 classification, the treaty investor must: Be a national of a country with which the United States maintains a treaty of commerce and navigation; Have invested, or be actively in the process of investing, a substantial amount of capital in a bona fide enterprise in the United States; and Be seeking to enter the United States solely to develop and direct the investment enterprise."
proposition: An E-2 treaty investor must be a national of a treaty country, have invested or be investing a substantial amount of capital in a real U.S. enterprise, and come solely to develop and direct it.
accessed: 2026-11-26
review_by: 2027-02-26
