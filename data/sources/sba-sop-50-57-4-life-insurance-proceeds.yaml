id: sba-sop-50-57-4-life-insurance-proceeds
tier: primary-rule
title: "SOP 50 57 4, Ch. 9: life insurance proceeds"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Lenders should apply the proceeds from an assigned life insurance policy to the principal balance of the Loan.
proposition: Proceeds of a life insurance policy assigned to the lender generally go to pay down the loan.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
