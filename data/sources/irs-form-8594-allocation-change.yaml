id: irs-form-8594-allocation-change
tier: official-doc
title: "Instructions for Form 8594: supplemental statement when the allocation changes"
publisher: Internal Revenue Service
url: https://www.irs.gov/instructions/i8594
quote: If the amount allocated to any asset is increased or decreased after the year in which the sale occurs, the seller and/or purchaser (whoever is affected) must complete Parts I and III of Form 8594 and attach the form to the income tax return for the year in which the increase or decrease is taken into account.
proposition: If a post-closing adjustment changes the price allocated to assets in a later year, the affected party files a supplemental Form 8594.
accessed: 2026-11-26
review_by: 2027-02-26
