id: sba-sop-50-10-8-1-upfront-fee
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 4: SBA guaranty (upfront) fee"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The Upfront Fee is the fee a 7(a) Lender must pay to SBA for each loan guaranteed under the 7(a) program. The 7(a) Lender is permitted to pass the cost of the Upfront Fee to the Borrower. ... However, the Upfront Fee is based on the guaranteed portion of the loan and not the total loan amount. ... However, SBA may announce temporary changes for a specific fiscal year through an Information Notice.
proposition: The SBA upfront guaranty fee may be passed to the borrower, is figured on the guaranteed portion of the loan, and SBA can change it for a fiscal year by Information Notice.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
