id: irs-pub-334-report-all-income
tier: official-doc
title: "Publication 334, Tax Guide for Small Business: kinds of income"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p334
quote: "You must report on your tax return all income you receive from your business, including income not reported to you on a Form 1099 filed by the payor, unless it is excluded by law. In most cases, your business income will be in the form of cash, checks, and credit card charges."
proposition: "A business must report all of its income on its tax return, including cash, unless the law excludes it."
accessed: 2026-11-26
review_by: 2027-02-26
