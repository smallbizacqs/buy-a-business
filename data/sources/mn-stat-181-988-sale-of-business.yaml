id: mn-stat-181-988-sale-of-business
tier: primary-rule
title: "Minnesota Statutes § 181.988, Covenants not to compete void"
publisher: Minnesota Office of the Revisor of Statutes
url: https://www.revisor.mn.gov/statutes/cite/181.988
quote: "Any covenant not to compete contained in a contract or agreement is void and unenforceable. ... the covenant not to compete is agreed upon during the sale of a business. The person selling the business and the partners, members, or shareholders, and the buyer of the business may agree on a temporary and geographically restricted covenant not to compete that will prohibit the seller of the business from carrying on a similar business within a reasonable geographic area and for a reasonable length of time"
proposition: "Minnesota voids employee non-competes but allows a seller's non-compete in a sale of a business if it is limited to a reasonable area and time."
accessed: 2026-11-26
review_by: 2027-02-26
