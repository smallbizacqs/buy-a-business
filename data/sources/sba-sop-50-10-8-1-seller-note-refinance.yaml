id: sba-sop-50-10-8-1-seller-note-refinance
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: refinancing seller debt"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Seller debt structured in conjunction with a change of ownership transaction is eligible to be refinanced after it has been in place and current for 36 months."
proposition: "Seller debt from an acquisition can be refinanced with SBA financing once it has been in place and current for 36 months."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
