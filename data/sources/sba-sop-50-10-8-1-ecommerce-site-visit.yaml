id: sba-sop-50-10-8-1-ecommerce-site-visit
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: site visits for virtual businesses"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For businesses that operate on a virtual, or otherwise non-customer facing physical location basis (i.e. e-commerce), the Lender may choose not to conduct a physical site visit. The Lender must document in the loan file the basis for determining that a site visit would not materially enhance verification of business operations and may utilize alternative methods, such as virtual meetings or review of business records, to confirm the existence and activity of the business.
proposition: For e-commerce and other virtual businesses, the lender may skip a physical site visit and verify the business by other documented means.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
