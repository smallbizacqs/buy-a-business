id: sba-sop-50-10-8-1-diligence-costs
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: financial due diligence costs"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The out-of-pocket costs associated with all financial due diligence reports may be passed on to the borrower. Any funds expended by the Applicant on the report can count toward the equity injection."
proposition: "The cost of the valuation and QoE may be passed to the borrower, and what the buyer spends on them can count toward the equity injection."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
