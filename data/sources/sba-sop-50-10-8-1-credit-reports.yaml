id: sba-sop-50-10-8-1-credit-reports
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: lender’s credit analysis"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Review and analyze the Applicant(s)’ owner(s), and Guarantor(s) personal credit reports and discuss any credit issues.
proposition: The lender reviews the personal credit reports of owners and guarantors and discusses any credit issues.
