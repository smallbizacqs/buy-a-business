id: sba-sop-50-57-4-past-due-financials
tier: primary-rule
title: "SOP 50 57 4, Ch. 3: past due financial statements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Lenders may charge a separate extraordinary servicing fee for past due financial statements if consistent with those fees the Lender charges on its similarly-sized, non-SBA guaranteed commercial loans ... Lenders may require Borrowers to submit past due financial statements as a condition for considering any future servicing requests made by the Borrower.
proposition: A lender may charge a fee for late financial statements and may refuse to consider servicing requests until past due statements are delivered.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
