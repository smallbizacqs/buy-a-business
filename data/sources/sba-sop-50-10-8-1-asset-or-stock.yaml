id: sba-sop-50-10-8-1-asset-or-stock
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: stock or asset purchase"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "A Borrower(s) (and any individual Co-Borrower as permitted in this Appendix) may use loan proceeds to fund a change of ownership through either a stock purchase (including a stock redemption) or an asset purchase, only under the circumstances described under this Paragraph."
proposition: "A 7(a) loan can fund either a stock purchase or an asset purchase, under the conditions in Appendix 15."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
