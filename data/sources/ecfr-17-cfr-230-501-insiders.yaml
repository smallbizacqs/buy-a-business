id: ecfr-17-cfr-230-501-insiders
tier: primary-rule
title: "17 CFR 230.501(a)(4): directors, executive officers and general partners"
publisher: U.S. Securities and Exchange Commission (eCFR)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: Any director, executive officer, or general partner of the issuer of the securities being offered or sold, or any director, executive officer, or general partner of a general partner of that issuer;
proposition: Directors, executive officers and general partners of the issuer are accredited investors for that offering.
