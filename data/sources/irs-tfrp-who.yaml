id: irs-tfrp-who
tier: official-doc
title: Employment taxes and the Trust Fund Recovery Penalty (TFRP)
publisher: Internal Revenue Service
url: https://www.irs.gov/businesses/small-businesses-self-employed/employment-taxes-and-the-trust-fund-recovery-penalty-tfrp
quote: "The TFRP may be assessed against any person who: Is responsible for collecting or paying withheld income and employment taxes, or for paying collected excise taxes, and Willfully fails to collect or pay them."
proposition: A person responsible for paying withheld payroll taxes who willfully fails to pay them can be personally assessed the Trust Fund Recovery Penalty.
accessed: 2026-11-26
