id: sba-sop-50-10-8-1-504-coo-conditions
tier: primary-rule
title: "SOP 50 10 8.1, Section C: 504 change of ownership conditions"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The change of ownership must result in the Applicant owning 100% of the business. The seller may not remain as an officer, director, stockholder or Key Employee of the business.
proposition: A 504 change of ownership must leave the buyer owning 100%, and the seller may not stay as an officer, director, owner or key employee.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
