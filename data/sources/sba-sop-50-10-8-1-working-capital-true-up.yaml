id: sba-sop-50-10-8-1-working-capital-true-up
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: working capital true-up"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Working capital adjustment provisions (e.g. working capital “true-up\") contained in the Purchase and Sales Agreement are not a rebate to the Borrower as the funds remedy a lack of working capital at the time of the acquisition. As such, any cash remitted to the borrower may be retained to support the ongoing working capital needs of the business and is not required to pay down the change of ownership loan."
proposition: "Under SBA rules a working-capital true-up in the purchase agreement is not a rebate, and cash paid to the buyer under it can stay in the business."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
