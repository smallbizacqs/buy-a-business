id: sba-sop-50-10-8-1-max-loan
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: maximum Standard 7(a) loan"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The maximum loan amount for any one Standard 7(a) loan is $5,000,000.
proposition: The largest Standard 7(a) loan is $5 million.
accessed: 2026-11-26
