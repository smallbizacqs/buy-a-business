quote: "For purposes of the 7(a) loan facilitating the change of ownership, the “Business Purchase Price” excludes all owner-occupied commercial real estate assets being acquired in the transaction."
proposition: "For SBA change-of-ownership rules, the Business Purchase Price excludes owner-occupied commercial real estate bought in the deal."
