id: sba-sop-50-10-8-1-life-insurance-shortfall
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 4: life insurance for 7(a) loans"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If the loan is not fully secured, life insurance is required in the amount of the collateral shortfall for the principals of sole proprietorships, single member LLCs, or for businesses otherwise dependent on one owner’s active participation.
proposition: When a 7(a) loan is not fully secured, life insurance equal to the collateral shortfall is required on the principal of a business that depends on one owner.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
