id: sba-sop-50-10-8-1-small-express-guaranty
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 16: guaranty percentages for 7(a) Small and SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For 7(a) Small loans: 85% for loans of $150,000 or less 75% for loans over $150,000 For SBA Express loans: 50%."
proposition: SBA guarantees up to 85% of a 7(a) Small loan of $150,000 or less, 75% of a larger 7(a) Small loan, and 50% of an SBA Express loan.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
