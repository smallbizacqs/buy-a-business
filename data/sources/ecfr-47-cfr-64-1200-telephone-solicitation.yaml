id: ecfr-47-cfr-64-1200-telephone-solicitation
tier: primary-rule
title: "47 CFR 64.1200: Delivery restrictions"
publisher: "Electronic Code of Federal Regulations"
url: https://www.ecfr.gov/current/title-47/part-64/section-64.1200
quote: "The term telephone solicitation means the initiation of a telephone call or message for the purpose of encouraging the purchase or rental of, or investment in, property, goods, or services, which is transmitted to any person"
proposition: "Under the FCC's rule, a telephone solicitation is a call or message made to encourage the purchase or rental of, or investment in, property, goods or services."
accessed: 2026-11-26
