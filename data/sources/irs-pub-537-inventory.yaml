id: irs-pub-537-inventory
tier: official-doc
title: "Publication 537, Installment Sales: inventory"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p537
quote: The regular sale of inventory of personal property doesn’t qualify as an installment sale even if you receive a payment after the year of sale.
proposition: Inventory sold as part of a deal does not qualify for installment reporting.
accessed: 2026-11-26
