id: irs-form-8594-residual-method
tier: official-doc
title: "Instructions for Form 8594: allocation of consideration"
publisher: Internal Revenue Service
url: https://www.irs.gov/instructions/i8594
quote: "An allocation of the purchase price must be made to determine the purchaser's basis in each acquired asset and the seller's gain or loss on the transfer of each asset. Use the residual method under sections 1.338-6 and 1.338-7, substituting consideration for ADSP and AGUB, for the allocation of the consideration to assets sold and assets purchased, respectively."
proposition: "The price in an asset purchase is allocated across the assets using the residual method, which sets the buyer's basis and the seller's gain or loss on each asset."
accessed: 2026-11-26
review_by: 2027-02-26
