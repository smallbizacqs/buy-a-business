id: irs-topic-559-niit
tier: official-doc
title: Topic no. 559, Net investment income tax
publisher: Internal Revenue Service
url: https://www.irs.gov/taxtopics/tc559
quote: A 3.8 percent net investment income tax (NIIT) applies to individuals, estates, and trusts that have net investment income above applicable threshold amounts. ... The NIIT applies to income from a trade or business that is (1) a passive activity, as determined under § 469, of the taxpayer; or (2) trading in financial instruments or commodities
proposition: A 3.8 percent tax on net investment income applies above threshold amounts, and reaches business income when the business is a passive activity for the taxpayer.
accessed: 2026-11-26
review_by: 2027-02-26
