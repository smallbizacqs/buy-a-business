title: Prohibited Employment Policies/Practices
publisher: U.S. Equal Employment Opportunity Commission
url: https://www.eeoc.gov/prohibited-employment-policiespractices
quote: Under the laws enforced by EEOC, it is illegal to discriminate against someone (applicant or employee) because of that person's race, color, religion, sex (including transgender status, sexual orientation, and pregnancy), national origin, age (40 or older), disability or genetic information.
proposition: Federal law bars employment discrimination against applicants and employees on listed protected characteristics.
