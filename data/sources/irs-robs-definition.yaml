id: irs-robs-definition
tier: official-doc
title: Rollovers as business start-ups compliance project
publisher: Internal Revenue Service
url: https://www.irs.gov/retirement-plans/rollovers-as-business-start-ups-compliance-project
quote: A ROBS is an arrangement in which prospective business owners use their retirement funds to pay for new business start-up costs. ROBS plans, while not considered an abusive tax avoidance transaction, are questionable because they may solely benefit one individual ... the individual who rolls over his or her existing retirement funds to the ROBS plan in a tax-free transaction. The ROBS plan then uses the rollover assets to purchase the stock of the new C Corporation business.
proposition: The IRS describes ROBS as using retirement funds to fund a business and calls the plans questionable, though not abusive tax avoidance; the retirement money is rolled into the plan tax-free and the plan buys the new C corporation's stock.
accessed: 2026-11-26
