id: sba-sop-50-10-8-1-lpr-ineligible
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 3: definition of Ineligible Person"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: A Lawful Permanent Resident (LPRs) (commonly referred to as “green card holders”), including individuals with permanent (Unconditional) LPR status, and Conditional LPR status;
proposition: Under SOP 50 10 8.1, lawful permanent residents (green card holders) are Ineligible Persons.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
