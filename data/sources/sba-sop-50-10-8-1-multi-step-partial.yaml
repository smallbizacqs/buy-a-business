id: sba-sop-50-10-8-1-multi-step-partial
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: multi-step partial changes of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Multi-step partial changes of ownership are not eligible. A multi-step partial change of ownership occurs when the change of ownership is structured such that some or all of the existing owners are bringing on a new owner(s) via the formation of a new entity that will become the 100% owner of the Operating Company
proposition: SBA will not finance a partial change of ownership done by forming a new holding entity that existing and new owners share.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
