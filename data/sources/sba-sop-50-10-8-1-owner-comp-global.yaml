id: sba-sop-50-10-8-1-owner-comp-global
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: owner compensation adjustments"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Adjustments made to ownership compensation must also be substantiated by a global cash flow analysis that demonstrates that the principals have the financial wherewithal to meet their obligations based upon the adjusted compensation proposed and must meet the 1:1 DSC on a global basis."
proposition: "An adjustment to owner pay must be backed by a global cash flow analysis showing the owners can meet their obligations on the adjusted pay, at 1:1 coverage."
