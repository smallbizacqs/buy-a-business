id: sba-sop-50-10-8-1-ineligible-businesses
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1, Para. E: ineligible businesses"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The SBA Lender must determine whether the Applicant is one of the types of businesses listed as ineligible (13 CFR § 120.110).
proposition: Some types of business are ineligible for SBA loans, and the lender must check.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
