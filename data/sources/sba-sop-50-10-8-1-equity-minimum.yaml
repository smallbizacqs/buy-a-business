id: sba-sop-50-10-8-1-equity-minimum
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.a: minimum equity injection"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Initial Acquisition: 10%. For Initial Acquisitions, the required equity injection cannot be reduced or eliminated."
proposition: A buyer making an initial acquisition must inject at least 10% equity, and the lender cannot reduce or waive it.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
