id: sba-sop-50-10-8-1-speculative-businesses
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1, Para. E: speculative businesses"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Speculative businesses are not eligible. This prohibits loans to an Applicant for: ... Engaging in a risky business for the chance of an unusually large profit."
proposition: Speculative businesses, including risky businesses run for the chance of an unusually large profit, are not eligible for SBA loans.
