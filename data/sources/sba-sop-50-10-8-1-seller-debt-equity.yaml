id: sba-sop-50-10-8-1-seller-debt-equity
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: seller debt as equity"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Seller debt that is subordinated to the Lender and on full standby (no payments of principal or interest for the term of the 7(a) loan) may be considered as equity for SBA’s purposes."
proposition: "Seller debt counts as equity for SBA purposes only if it is subordinated and on full standby, with no principal or interest payments for the life of the 7(a) loan."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
