id: ecfr-16-cfr-436-1-transfer-not-sale
tier: primary-rule
title: "16 CFR 436.1(t): definition of sale of a franchise"
publisher: Federal Trade Commission (eCFR)
url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-D/part-436/section-436.1
quote: It also does not include the transfer of a franchise by an existing franchisee where the franchisor has had no significant involvement with the prospective transferee. A franchisor's approval or disapproval of a transfer alone is not deemed to be significant involvement.
proposition: A resale by an existing franchisee is not a "sale of a franchise" under the FTC rule when the franchisor has no significant involvement with the buyer; approving or rejecting the transfer alone is not significant involvement.
accessed: 2026-11-26
review_by: 2027-11-26
