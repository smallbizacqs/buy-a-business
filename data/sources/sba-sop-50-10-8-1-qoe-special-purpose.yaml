id: sba-sop-50-10-8-1-qoe-special-purpose
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: QoE and special purpose property"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "A Quality of Earnings report is not required for a transaction involving the acquisition of an owner-occupied Special Purpose Property, regardless of the Business Purchase Price."
proposition: "No QoE is required when the acquisition involves an owner-occupied special purpose property, whatever the price."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
