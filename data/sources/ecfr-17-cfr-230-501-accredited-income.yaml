id: ecfr-17-cfr-230-501-accredited-income
tier: primary-rule
title: "17 CFR 230.501: Accredited investor: income"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: Any natural person who had an individual income in excess of $200,000 in each of the two most recent years or joint income with that person's spouse or spousal equivalent in excess of $300,000 in each of those years and has a reasonable expectation of reaching the same income level in the current year;
proposition: A natural person with income over $200,000 (or $300,000 joint) in each of the last two years, expecting the same this year, is an accredited investor.
accessed: 2026-11-26
review_by: 2027-02-26
