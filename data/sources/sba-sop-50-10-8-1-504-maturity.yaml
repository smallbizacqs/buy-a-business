id: sba-sop-50-10-8-1-504-maturity
tier: primary-rule
title: "SOP 50 10 8.1, Section C: 504 loan maturities"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Maturity of the 504 loan is 10, 20, or 25 years based upon the remaining useful life of the property being financed as follows: A maximum of 25 years for real estate;"
proposition: A 504 loan has a 10, 20 or 25-year maturity, up to 25 years for real estate.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
