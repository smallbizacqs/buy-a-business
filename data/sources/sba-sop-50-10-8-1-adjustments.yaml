id: sba-sop-50-10-8-1-adjustments
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2: cash-flow adjustments"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Lender may make prudent adjustments to the cash flow of the acquired entity based on savings that can be realized through the transaction as part of satisfying this requirement."
proposition: "The lender may make prudent adjustments for savings the transaction will realize when testing coverage."
