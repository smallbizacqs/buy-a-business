id: ecfr-29-cfr-778-211-promised-bonuses
tier: primary-rule
title: "29 CFR 778.211(c): promised bonuses, including retention bonuses, count in the regular rate"
publisher: National Archives, Electronic Code of Federal Regulations
url: https://www.ecfr.gov/current/title-29/part-778/section-778.211
quote: Bonuses which are announced to employees to induce them to work more steadily or more rapidly or more efficiently or to remain with the firm are regarded as part of the regular rate of pay.
proposition: Under the federal overtime rules, a bonus announced in advance to keep employees with the firm is part of the regular rate used to figure overtime.
