id: irs-worker-classification
tier: official-doc
title: "Independent contractor (self-employed) or employee?"
publisher: Internal Revenue Service
url: https://www.irs.gov/businesses/small-businesses-self-employed/independent-contractor-self-employed-or-employee
quote: "Facts that provide evidence of the degree of control and independence fall into three categories: Behavioral: Does the company control or have the right to control what the worker does and how the worker does his or her job? Financial: Are the business aspects of the worker’s job controlled by the payer?"
proposition: "The IRS weighs behavioral control, financial control and the type of relationship to decide whether a worker is an employee or a contractor."
accessed: 2026-11-26
review_by: 2027-02-26
