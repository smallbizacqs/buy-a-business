id: sba-sop-50-10-8-1-interest-rate-negotiated
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 18: 7(a) interest rate requirements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: A loan may have a fixed or variable interest rate. ... The Lender negotiates the interest rate with the Applicant, subject to SBA’s maximum allowable rates. SBA will periodically publish the maximum allowable fixed interest rate in the Federal Register.
proposition: A 7(a) rate may be fixed or variable, is negotiated with the lender up to SBA maximums, and SBA publishes the maximum fixed rate in the Federal Register.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
