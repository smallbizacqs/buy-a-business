title: Investment capital (Small Business Investment Companies)
publisher: U.S. Small Business Administration
url: https://www.sba.gov/funding-programs/investment-capital
quote: An SBIC is a privately owned company that’s licensed and regulated by the SBA. SBICs invest in small businesses in the form of debt and equity. ... A typical SBIC loan ranges from $250,000 to $10 million, with an interest rate between 9% and 16%.
proposition: SBICs are private, SBA-licensed funds that lend to and invest in small businesses; SBA says a typical SBIC loan is $250,000 to $10 million at 9% to 16% interest.
