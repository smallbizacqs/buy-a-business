id: sba-sop-50-10-8-1-partial-co-borrowers
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: co-borrowers in a partial change of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Both the Operating Company and any new direct and/or indirect owner (including individuals and entities) who are acquiring any direct and/or indirect ownership interest in the Operating Company must be Co-Borrowers on the new loan, regardless of the percentage of ownership being acquired.
proposition: In an SBA partial change of ownership, every new owner, however small the stake, is a co-borrower with the business.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
