id: sba-sop-50-10-8-1-dsc-covenants
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: DSC covenants"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The Lender may require inclusion of covenants such as DSC into investor agreements, or include DSC covenants into the loan agreement, to ensure that the business has sufficient cash flow to make distributions beyond tax purposes.
proposition: In an acquisition, the lender may put debt service coverage covenants in the loan agreement or investor agreements.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
