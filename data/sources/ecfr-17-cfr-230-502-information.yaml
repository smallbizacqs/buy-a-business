id: ecfr-17-cfr-230-502-information
tier: primary-rule
title: "17 CFR 230.502: Information requirements"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.502
quote: If the issuer sells securities under § 230.506(b) to any purchaser that is not an accredited investor, the issuer shall furnish the information specified in paragraph (b)(2) of this section to such purchaser a reasonable time prior to sale.
proposition: A Rule 506(b) issuer that sells to a non-accredited investor must give that investor specified information before the sale.
accessed: 2026-11-26
