id: sba-sop-50-10-8-1-small-express-life-insurance
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: life insurance for 7(a) Small and SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For 7(a) Small Loans, SBA Express and Export Express loans, SBA Lenders may follow their internal written policy for their similarly-sized, non-SBA guaranteed commercial loans.
proposition: For 7(a) Small and SBA Express loans, whether life insurance is required follows the lender’s own written policy for similar non-SBA loans.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
