id: ecfr-17-cfr-230-506-c-verification
tier: primary-rule
title: "17 CFR 230.506: Rule 506(c) verification"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.506
quote: The issuer shall take reasonable steps to verify that purchasers of securities sold in any offering under paragraph (c) of this section are accredited investors.
proposition: A Rule 506(c) issuer must take reasonable steps to verify that each purchaser is accredited.
accessed: 2026-11-26
