title: "BizBuySell Terms of Use: who may post a listing"
publisher: CoStar Realty Information, Inc. (BizBuySell)
url: https://www.bizbuysell.com/terms-of-use/
quote: You shall not post a Listing on the Website under a name, or using a contact, other than the business owner or the licensed broker or agent that is engaged by the business owner to market the Listing under a duly executed, active, exclusive listing agreement with the owner.
proposition: BizBuySell listings are posted by the owner or by a broker the owner has engaged under an exclusive listing agreement.
