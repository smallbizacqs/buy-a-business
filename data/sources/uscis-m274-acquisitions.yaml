id: uscis-m274-acquisitions
tier: official-doc
title: "Handbook for Employers M-274, 8.0: acquisitions and mergers"
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/i-9-central/form-i-9-resources/handbook-for-employers-m-274/80-rules-for-continuing-employment-and-other-special-rules
quote: "Employers who have acquired or merged with another company have two options: Option A: Treat all acquired employees as new hires and complete a new Form I-9 for every individual."
proposition: "An employer that acquires or merges with a company has two options for Forms I-9; the first is to treat acquired employees as new hires and complete new forms for all of them."
