id: sba-sop-50-10-8-1-intangibles
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: intangible assets in a change of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "A 7(a) loan may be used to finance a change of ownership that includes intangible assets (including, but not limited to, goodwill, client/customer lists, patents, copyrights, trademarks, intellectual property, and agreements not to compete) as long as the financial due diligence requirements set forth in Paragraph C.1 of this Appendix are met."
proposition: "A 7(a) loan can finance intangible assets in an acquisition, including goodwill, customer lists and agreements not to compete, if the financial due diligence rules are met."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
