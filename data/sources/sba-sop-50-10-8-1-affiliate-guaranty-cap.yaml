id: sba-sop-50-10-8-1-affiliate-guaranty-cap
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 16: guaranty cap for a business and its affiliates"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The maximum dollar amount outstanding of SBA’s guaranty to any one business and its affiliates must not exceed $3,750,000 (13 CFR § 120.151).
proposition: SBA’s outstanding guaranty to one business and its affiliates combined cannot exceed $3,750,000.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
