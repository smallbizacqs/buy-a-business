id: sba-sop-50-10-8-1-prohibited-fees
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: prohibited fees"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Charge the Borrower any commitment, bonus, origination, broker, commission, referral, or similar fees; Charge points or add-on interest; Charge prepayment fees;
proposition: 7(a) lenders may not charge origination, broker or referral fees, points, or their own prepayment fees.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
