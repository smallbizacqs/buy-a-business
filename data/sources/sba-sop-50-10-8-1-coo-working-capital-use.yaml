id: sba-sop-50-10-8-1-coo-working-capital-use
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: uses of proceeds in a change of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Change of ownership transactions may include funds for: Working Capital; Borrower out of pocket expenses (including business valuations and QoE); and Owner-Occupied Commercial Real Estate when structured on a blended basis."
proposition: An SBA acquisition loan may include working capital, the buyer’s out-of-pocket costs such as the valuation and QoE, and owner-occupied real estate.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
