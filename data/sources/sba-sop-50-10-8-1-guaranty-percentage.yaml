id: sba-sop-50-10-8-1-guaranty-percentage
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 16: maximum guaranty amounts and percentages"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The maximum guaranty amount is $3,750,000. The maximum guaranty percentage is: 85% for loans of $150,000 or less 75% for loans over $150,000"
proposition: SBA guarantees at most 85% of a 7(a) loan of $150,000 or less and 75% of a larger loan, up to $3.75 million of guaranty.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
