id: sba-sop-50-57-4-financial-statement-waiver
tier: primary-rule
title: "SOP 50 57 4, Ch. 10: modifying financial statement requirements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Lenders should not modify Loan Document provisions that require Obligors to submit periodic financial statements (e.g., temporarily or permanently waive; change from audited to compiled or reviewed; or require less frequently), unless a lender exercising Prudent Servicing practices would do so based on the circumstances.
proposition: Lenders should not waive or loosen the loan documents’ financial statement requirements unless prudent servicing supports it.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
