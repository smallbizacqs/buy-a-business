id: sba-sop-50-10-8-1-investor-distributions
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: distributions to equity investors"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: When Equity Investments are used to meet the equity injection requirements, distributions to the investor that are not made solely for the purpose of satisfying the investor’s tax obligations attributable to the business’s income are prohibited until the 7(a) loan has been paid off.
proposition: Investors whose money meets the equity injection can receive only tax distributions until the 7(a) loan is paid off.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
