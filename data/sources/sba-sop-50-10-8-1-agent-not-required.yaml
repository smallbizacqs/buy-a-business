id: sba-sop-50-10-8-1-agent-not-required
tier: primary-rule
title: "SOP 50 10 8.1, Section A: no Agent required"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "7(a) Lenders and Agents must clearly inform any Applicant that the SBA does not require the use of an Agent for packaging or referring a loan application."
proposition: "SBA does not require a borrower to use a packager or referral agent, and lenders and agents must say so."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
