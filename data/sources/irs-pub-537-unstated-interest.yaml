id: irs-pub-537-unstated-interest
tier: official-doc
title: "Publication 537, Installment Sales: unstated interest"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p537
quote: If your sale calls for payments in a later year and the sales contract provides for little or no interest, you may have to figure unstated interest or original issue discount (OID), even if you have a loss.
proposition: A seller-financed sale with little or no stated interest can have unstated interest or OID for tax purposes.
accessed: 2026-11-26
review_by: 2027-02-26
