id: ecfr-29-cfr-778-107-overtime
tier: primary-rule
title: "29 CFR 778.107: general standard for overtime pay"
publisher: National Archives, Electronic Code of Federal Regulations
url: https://www.ecfr.gov/current/title-29/part-778/section-778.107
quote: The general overtime pay standard in section 7(a) requires that overtime must be compensated at a rate not less than one and one-half times the regular rate at which the employee is actually employed.
proposition: Federal law requires overtime for covered employees at not less than one and one-half times their regular rate.
