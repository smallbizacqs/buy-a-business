id: sba-sop-50-10-8-1-qoe-owner-buyout-exempt
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: QoE not required for owner buyouts and ESOPs"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Owner Buyout and ESOP & Cooperative transactions are not subject to the QoE requirement because the existing owner(s) retain operational knowledge of the business and the transaction does not result in a change to the management or operating structure."
proposition: "The SBA QoE requirement does not apply to owner buyouts or ESOP and cooperative transactions."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
