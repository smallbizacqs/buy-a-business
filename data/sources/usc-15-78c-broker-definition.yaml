id: usc-15-78c-broker-definition
tier: primary-rule
title: "15 U.S.C. 78c(a)(4): definition of broker"
publisher: U.S. Government Publishing Office (United States Code)
url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2B-sec78c.htm
quote: means any person engaged in the business of effecting transactions in securities for the account of others
proposition: Under the Exchange Act, a broker is anyone in the business of effecting securities transactions for others.
