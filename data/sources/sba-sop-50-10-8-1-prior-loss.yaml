id: sba-sop-50-10-8-1-prior-loss
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: prior loss to the government"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: An Applicant is not eligible for a 7(a) or 504 loan if there is a prior loss to the Federal government.
proposition: A prior loss to the federal government, such as a defaulted federal loan, makes an applicant ineligible.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
