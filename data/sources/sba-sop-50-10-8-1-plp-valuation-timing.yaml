id: sba-sop-50-10-8-1-plp-valuation-timing
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: valuation and QoE timing under PLP"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "If the application is submitted under PLP authority, the business valuation and QoE may be obtained and reviewed after the issuance of an SBA Loan Number and prior to closing, so long as they are in process."
proposition: "A lender using delegated (PLP) authority may finish the valuation and QoE after the SBA loan number is issued, as long as they are under way and done before closing."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
