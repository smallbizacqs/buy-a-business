id: sba-sop-50-57-4-default-definition
tier: primary-rule
title: "SOP 50 57 4, Ch. 2: definition of Default"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: Default means any event, including when a Borrower fails to make a payment when due, listed in the SBA Form 147 “Note” or other Loan Documents.
proposition: A default on a 7(a) loan is any event listed in the note or other loan documents, not only a missed payment.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
