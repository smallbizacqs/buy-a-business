id: sba-sop-50-10-8-1-ar-inventory-collateral
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: collateral values for receivables and inventory"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Lenders must take a security interest in the accounts receivable and inventory of the operating entity. When the Lender takes a security interest in the accounts receivable and inventory, no more than 10% of the current book value of the assets may be used for the fully secured calculation.
proposition: Receivables and inventory count for no more than 10% of book value toward the SBA fully secured test.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
