id: sba-sop-50-10-8-1-working-assets-line
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: working assets on a line of credit"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Lenders may fund a portion of the purchase related to the working assets of the firm onto a line of credit as outlined in Section C. Para. 3.d.i.e of this Appendix."
proposition: "A lender may finance the part of the purchase that relates to working assets (such as receivables and inventory) on a line of credit."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
