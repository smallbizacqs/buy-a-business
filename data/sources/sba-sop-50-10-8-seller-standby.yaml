id: sba-sop-50-10-8-seller-standby
tier: primary-rule
title: "SOP 50 10 8 (effective June 1, 2025): seller debt as equity"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-05/SOP%2050%2010%208%20Technical%20Updates%20effective%206.1.2025.docx
quote: Seller debt may not be considered as part of the equity injection unless it is on full standby for the life of the SBA loan, and it does not exceed half of the SBA-required equity injection;
proposition: Under SOP 50 10 8, seller debt counted as equity only on full standby for the life of the loan and for no more than half the required injection.
accessed: 2026-11-26
review_by: 2027-02-26
notes: Superseded by SOP 50 10 8.1 for loans numbered on or after 2026-10-01; cited for the history of the rule.
