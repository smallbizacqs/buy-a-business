id: sba-sop-50-10-8-1-lease-term
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 3: lease term when the borrower leases space"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The SBA Lender must obtain a copy of the written lease between the Borrower and the landlord. For 7(a) loans, the lease term, including renewal options exercisable only by the Borrower, should equal or exceed the term of the loan."
proposition: "Where this paragraph applies, the lender must get a copy of the lease, and for 7(a) loans the lease term including the borrower's renewal options should equal or exceed the loan term."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review. This paragraph sits under 'Responsibilities When the Borrower is Leasing Space' and applies when $500,000 or 30% of loan proceeds or collateral (whichever is less) relates to leasehold improvements, fixtures or attached equipment."
