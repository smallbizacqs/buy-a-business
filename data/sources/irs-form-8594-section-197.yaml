id: irs-form-8594-section-197
tier: official-doc
title: "Instructions for Form 8594: section 197 intangibles"
publisher: Internal Revenue Service
url: https://www.irs.gov/instructions/i8594
quote: Any covenant not to compete entered into in connection with the acquisition of an interest in a trade or a business; and Any franchise, trademark, or trade name
proposition: A non-compete signed in connection with buying a business, and franchises, trademarks and trade names, are section 197 intangibles.
