id: copyright-circ30-work-for-hire
tier: official-doc
title: "Circular 30: Works Made for Hire"
publisher: U.S. Copyright Office
url: https://www.copyright.gov/circs/circ30.pdf
quote: A work prepared by an employee within the scope of his or her employment ... If a work fails to satisfy any of these requirements, it is not a work made for hire. ... If a work is a work made for hire, the employer or the party that specially ordered or commissioned that work is the author of that work.
proposition: Work by an employee within the scope of employment is a work made for hire owned by the employer; commissioned work is a work made for hire only if it meets every statutory requirement, including a signed written agreement.
accessed: 2026-11-26
review_by: 2027-11-26
