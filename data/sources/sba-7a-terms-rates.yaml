id: sba-7a-terms-rates
tier: official-doc
title: "7(a) loan program terms, conditions and eligibility: interest rates"
publisher: U.S. Small Business Administration
url: https://www.sba.gov/partners/lenders/7a-loan-program/terms-conditions-eligibility
quote: Interest rates for 7(a) loans are negotiated between the borrower and the lender, but are subject to SBA maximums, which are pegged to the prime rate or an optional peg rate. Interest rates may be fixed or variable. SBA publishes the maximum fixed interest rates on SBA’s FTA wiki
proposition: 7(a) rates are negotiated with the lender up to SBA maximums tied to prime or an optional peg rate, and SBA publishes maximum fixed rates on its FTA wiki.
