id: uscis-i9-section-2-timing
tier: official-doc
title: "Completing Section 2: Employer Review and Attestation"
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/i-9-central/complete-correct-form-i-9/completing-section-2-employer-review-and-attestation
quote: "As an employer, you or your authorized representative must complete and sign Section 2 of Form I-9, Employment Eligibility Verification, within 3 business days of the date of hire of your employee (the hire date means the first day of work for pay)."
proposition: "Section 2 of Form I-9 must be completed within 3 business days of an employee's first day of work for pay."
accessed: 2026-11-26
review_by: 2027-11-26
