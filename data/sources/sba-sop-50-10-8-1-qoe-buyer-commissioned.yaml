id: sba-sop-50-10-8-1-qoe-buyer-commissioned
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: a QoE the buyer commissioned"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Recognizing that some Applicant buyers may elect to commission their own QoE prior to engaging with the Lender for financing as part of their own due diligence, Lenders may elect to have that report reviewed by one of their approved vendors to help mitigate costs."
proposition: "A lender may have a QoE the buyer commissioned reviewed by one of its approved vendors instead of ordering a new one."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
