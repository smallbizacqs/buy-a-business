id: sba-sop-50-10-8-1-hazard-express-exception
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: hazard insurance exception for SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Exceptions for SBA Express and Export Express ... If the Lender does not require hazard insurance (for example, if it would impose an undue burden on an Applicant given the small size of a loan), the Lender must document the reason in its loan file.
proposition: An SBA Express lender may skip hazard insurance, for example on a very small loan, if it documents why.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
