id: sba-sop-50-10-8-1-minority-investor
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: non-controlling minority equity investments"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: To be considered as eligible equity, the investment may not be subject to any agreement to repay or make distributions to recover the investment prior to release of the SBA guaranty. To qualify as a Non-controlling Minority Equity Investor, the investor must have less than 20% equity in and exert no control over the operating business.
proposition: A minority equity investment counts as SBA equity only if it isn’t repayable before the guaranty is released and the investor holds under 20% with no control.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
