id: sba-sop-50-10-8-1-life-insurance-assignment
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: life insurance assignment"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For each policy required under this Paragraph, SBA Lenders must obtain a collateral assignment identifying the 7(a) Lender (for 7(a)), or the CDC/SBA (for 504), as assignee that is acknowledged by the Home Office of the Insurer. SBA Lenders must ensure that the Applicant/Borrower pays the premiums on the policy ... SBA Lenders may accept the pledge of an existing life insurance policy. Credit life insurance or whole life insurance should not be required.
proposition: Required life insurance is collaterally assigned to the lender, the borrower pays the premiums, an existing policy may be pledged, and credit life or whole life should not be required.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
