id: sba-sop-50-10-8-1-form-159
tier: primary-rule
title: "SOP 50 10 8.1, Section A: SBA Form 159 fee disclosure"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For Agents not covered by an SBA-reviewed LSP Agreement, whether paid by the Applicant or the Lender, SBA Form 159 must be completed and signed by the Applicant, the Agent, and the Lender."
proposition: "Fees paid to an Agent on an SBA loan are disclosed on SBA Form 159, signed by the applicant, the Agent and the lender."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
