id: ecfr-16-cfr-436-2-disclosure-14-days
tier: primary-rule
title: "16 CFR 436.2: Obligation to furnish documents (FTC Franchise Rule)"
publisher: Federal Trade Commission (eCFR)
url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-D/part-436/section-436.2
quote: For any franchisor to fail to furnish a prospective franchisee with a copy of the franchisor's current disclosure document, as described in subparts C and D of this part, at least 14 calendar-days before the prospective franchisee signs a binding agreement with, or makes any payment to, the franchisor or an affiliate in connection with the proposed franchise sale.
proposition: A franchisor must give a prospective franchisee its current disclosure document at least 14 calendar days before the buyer signs a binding agreement or pays anything.
accessed: 2026-11-26
review_by: 2027-11-26
