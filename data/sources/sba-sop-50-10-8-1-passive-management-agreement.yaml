id: sba-sop-50-10-8-1-passive-management-agreement
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1, Para. E.3: management agreements and passive businesses"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Businesses that have entered into a management agreement with a third party that gives the management company sole discretion over the business operations are ineligible passive businesses.
proposition: A business that hands sole discretion over its operations to a third-party manager is an ineligible passive business for SBA lending.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
