id: ecfr-17-cfr-230-506-c-accredited
tier: primary-rule
title: "17 CFR 230.506: Rule 506(c) purchasers and verification"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.506
quote: All purchasers of securities sold in any offering under paragraph (c) of this section are accredited investors.
proposition: Every purchaser in a Rule 506(c) offering must be an accredited investor.
