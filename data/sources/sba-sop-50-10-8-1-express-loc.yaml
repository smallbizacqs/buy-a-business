id: sba-sop-50-10-8-1-express-loc
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2 and Appendix 17: SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA Express loans may not exceed $500,000. ... May not exceed 10 years inclusive of a term-out period.
proposition: SBA Express loans are capped at $500,000, and an SBA Express line of credit may not exceed 10 years including any term-out.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
