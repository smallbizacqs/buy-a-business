id: healthcare-gov-cobra
tier: official-doc
title: "Special Enrollment Period (SEP)"
publisher: "HealthCare.gov (U.S. Centers for Medicare & Medicaid Services)"
url: https://www.healthcare.gov/coverage-outside-open-enrollment/special-enrollment-period/
quote: "COBRA (Consolidated Omnibus Budget Reconciliation Act) is a federal law that lets you and your family continue your employer-sponsored group health insurance for a limited time after a qualifying life event, like losing your job, having your work hours reduced, or other qualifying life events."
proposition: "COBRA lets a person who leaves a job keep their employer's group health insurance for a limited time."
