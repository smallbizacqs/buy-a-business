id: sba-sop-50-10-8-1-flood-sfha
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: flood insurance in a special flood hazard area"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If any portion of a building that is collateral for the loan is located in a special flood hazard area, the SBA Lender must require the Applicant to obtain flood insurance for the building under the NFIP or comparable private flood insurance
proposition: If any part of a building pledged as collateral is in a special flood hazard area, the borrower must carry NFIP or comparable private flood insurance on it.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
