id: sba-sop-50-10-8-1-business-expansion
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: Business Expansion transactions"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Business Expansion: A change of ownership transaction in which an existing operating business purchases another. ... An existing small business that has been operating for at least two full fiscal years with the current ownership purchasing 100% of the ownership interest in another business."
proposition: A 7(a) Business Expansion is an existing business, operating for at least two full fiscal years under current ownership, buying 100% of another business.
accessed: 2026-11-26
