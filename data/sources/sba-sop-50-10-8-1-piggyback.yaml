id: sba-sop-50-10-8-1-piggyback
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: piggyback structures"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The Lender must not have a 7(a) loan in a “piggyback” structure. Piggyback financing occurs when one or more lenders provide more than one loan to a single Borrower at or about the same time, financing the same or similar purpose, and where the SBA-guaranteed loan is secured with a junior lien position or no lien position on the collateral securing the non-guaranteed loan(s).
proposition: A 7(a) loan may not sit junior to, or unsecured behind, another lender’s loan made at about the same time for the same purpose.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
