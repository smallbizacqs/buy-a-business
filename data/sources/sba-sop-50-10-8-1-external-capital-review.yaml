id: sba-sop-50-10-8-1-external-capital-review
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: loan documentation"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For transactions involving external capital, the Lender must underwrite and review the terms of all other debt and equity investments. For purposes of change of ownership, any transaction that involved an owner receiving shares in the business in exchange for cash or other contributions would be considered equity investments.
proposition: The SBA lender must review the terms of all other debt and equity in an acquisition, and an owner receiving shares for cash is an equity investment.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
