id: sba-sop-50-10-8-1-environmental-investigation
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5, Para. E: when an environmental investigation is required"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA requires an Environmental Investigation of all commercial Property upon which a security interest such as a mortgage, deed of trust, or leasehold deed of trust is offered as security for a loan or debenture. The type and depth of an Environmental Investigation to be performed varies with the risks of Contamination.
proposition: SBA requires an environmental investigation of commercial property pledged as loan collateral (by mortgage, deed of trust or leasehold deed of trust), scaled to the contamination risk.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
