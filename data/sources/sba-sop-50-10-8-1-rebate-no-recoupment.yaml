id: sba-sop-50-10-8-1-rebate-no-recoupment
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: seller rebates and the subsidy recoupment fee"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "In accordance with 13 CFR § 120.223, SBA's requirement to apply seller rebate payments to principal does not trigger a subsidy recoupment fee."
proposition: "Applying a seller rebate to 7(a) principal, as SBA requires, does not trigger a subsidy recoupment fee."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
