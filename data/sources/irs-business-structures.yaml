id: irs-business-structures
tier: official-doc
title: "Business structures"
publisher: Internal Revenue Service
url: https://www.irs.gov/businesses/small-businesses-self-employed/business-structures
quote: "Your form of business determines which income tax return form you have to file. The most common forms of business are the sole proprietorship, partnership, corporation, and S corporation. A limited liability company (LLC) is a business structure allowed by state statute. Legal and tax considerations enter into selecting a business structure."
proposition: "The entity type determines which tax return a business files; the common forms are sole proprietorship, partnership, corporation, S corporation and LLC."
accessed: 2026-11-26
