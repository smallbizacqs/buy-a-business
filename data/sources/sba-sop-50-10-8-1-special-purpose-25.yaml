id: sba-sop-50-10-8-1-special-purpose-25
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: Special Purpose Properties exemption"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For transactions involving the acquisition of an owner-occupied Special Purpose Property which includes the business operating from that property, the Lender may also structure the loan with a maturity of up to 25 years if 85% or more of the use of the total project costs are for real estate.
proposition: An acquisition of an owner-occupied special purpose property can have up to a 25-year maturity when 85% or more of project costs are real estate.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
