id: irs-tfrp-responsible-person
tier: official-doc
title: Employment taxes and the Trust Fund Recovery Penalty (TFRP)
publisher: Internal Revenue Service
url: https://www.irs.gov/businesses/small-businesses-self-employed/employment-taxes-and-the-trust-fund-recovery-penalty-tfrp
quote: These taxes are called trust fund taxes because you actually hold the employee's money in trust until you make a federal tax deposit in that amount. The TFRP may apply to you if these unpaid trust fund taxes cannot be immediately collected from the business. ... A responsible person is a person or group of people who has the duty to perform and the power to direct the collecting, accounting, and paying of trust fund taxes.
proposition: Unpaid withheld payroll taxes are trust fund taxes; if the business cannot pay them, the IRS can assess a penalty on responsible people who direct collecting and paying them.
accessed: 2026-11-26
