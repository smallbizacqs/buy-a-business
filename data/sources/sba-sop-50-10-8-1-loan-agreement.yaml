id: sba-sop-50-10-8-1-loan-agreement
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 6: loan agreement"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA does not require a separate loan agreement to be signed by the Borrower. If the Lender requires a separate loan agreement on its non-SBA guaranteed loans, it must do so on its SBA-guaranteed loans. The Lender may use its own form of loan agreement.
proposition: SBA does not require a separate loan agreement; a lender that uses one on its other loans must use one on SBA loans, and may use its own form.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
