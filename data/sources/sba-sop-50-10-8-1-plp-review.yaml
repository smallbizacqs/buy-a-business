id: sba-sop-50-10-8-1-plp-review
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: processing methods"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: When a Lender submits a Standard 7(a) loan guaranty request under the Lender’s PLP authority, the Agency does not review the Lender’s analysis of the credit or structure of the loan or line of credit prior to issuing a loan number.
proposition: Under delegated PLP authority, SBA does not review the lender’s credit analysis before issuing a loan number.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
