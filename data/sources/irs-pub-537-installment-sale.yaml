id: irs-pub-537-installment-sale
tier: official-doc
title: "Publication 537, Installment Sales: what an installment sale is"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p537
quote: An installment sale is a sale of property where you receive at least one payment after the tax year of the sale. If you realize a gain on an installment sale, you may be able to report part of your gain when you receive each payment.
proposition: A seller paid at least partly after the year of sale may be able to report gain as each payment is received.
accessed: 2026-11-26
review_by: 2027-02-26
