id: sba-sop-50-10-8-1-personal-liquidity
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: credit not available elsewhere"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The liquidity of owners of 20% or more of the equity of the Applicant, their spouses and minor children, and the Applicant itself (except that SBA permits owners to have reasonable funds set aside for possible future medical expenses, educational expenses (including for the children of the business owner) and retirement needs;
proposition: The lender considers whether 20% owners could fund the need from their own liquid assets, allowing reasonable reserves for medical, education and retirement needs.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
