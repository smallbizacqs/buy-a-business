id: sba-sop-50-10-8-1-equity-limited-sources
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.a: limited equity sources"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Limited Equity Injection Sources: The following sources, whether individually or in the aggregate, may provide no more than half of the required Equity Injection."
proposition: Limited sources (standby debt, standby seller debt, minority equity investments) may supply no more than half of the required equity.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
