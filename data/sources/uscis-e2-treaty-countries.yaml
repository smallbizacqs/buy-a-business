tier: official-doc
title: "E-2 Treaty Investors: treaty countries and period of stay"
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-2-treaty-investors
quote: See U.S. Department of State's Treaty Countries for a current list of countries with which the United States maintains a treaty of commerce and navigation. ... Qualified treaty investors and employees will be allowed a maximum initial stay of two years.
proposition: Only nationals of countries on the State Department's treaty list can use E-2, and the initial stay is at most two years.
