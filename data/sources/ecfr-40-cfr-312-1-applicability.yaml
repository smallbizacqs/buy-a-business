id: ecfr-40-cfr-312-1-applicability
tier: primary-rule
title: "40 CFR 312.1: who the All Appropriate Inquiries rule applies to"
publisher: Environmental Protection Agency (eCFR)
url: https://www.ecfr.gov/current/title-40/chapter-I/subchapter-J/part-312/section-312.1
quote: The innocent landowner defense pursuant to CERCLA sections 101(35) and 107(b)(3); ... The bona fide prospective purchaser liability protection pursuant to CERCLA sections 101(40) and 107(r);
proposition: The All Appropriate Inquiries rule applies to people seeking the innocent landowner defense or bona fide prospective purchaser protection under federal Superfund law (CERCLA).
