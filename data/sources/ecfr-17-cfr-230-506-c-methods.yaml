id: ecfr-17-cfr-230-506-c-methods
tier: primary-rule
title: "17 CFR 230.506(c)(2)(ii): non-exclusive verification methods"
publisher: U.S. Securities and Exchange Commission (eCFR)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.506
quote: In regard to whether the purchaser is an accredited investor on the basis of income, reviewing any Internal Revenue Service form that reports the purchaser's income for the two most recent years ... Obtaining a written confirmation from one of the following persons or entities that such person or entity has taken reasonable steps to verify that the purchaser is an accredited investor within the prior three months ... A registered broker-dealer; ... An investment adviser registered with the Securities and Exchange Commission; ... A licensed attorney who is in good standing ... A certified public accountant who is duly registered and in good standing
proposition: Rule 506(c) lists ways to verify accredited status, including reviewing IRS income forms for two years or getting a written confirmation from a listed professional dated within three months.
accessed: 2026-11-26
review_by: 2027-02-26
