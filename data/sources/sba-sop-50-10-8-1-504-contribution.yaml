id: sba-sop-50-10-8-1-504-contribution
tier: primary-rule
title: "SOP 50 10 8.1, Section C: 504 borrower contribution"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: All Borrowers must contribute at least 10%, which may be borrowed as long as it is subordinate to the Third Party Loan and the 504 debenture; New businesses must contribute at least 15%.
proposition: A 504 borrower contributes at least 10% (15% for a new business), and it may be borrowed if subordinate.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
