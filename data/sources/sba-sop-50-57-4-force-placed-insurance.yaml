id: sba-sop-50-57-4-force-placed-insurance
tier: primary-rule
title: "SOP 50 57 4, Ch. 9: forced placement of hazard insurance"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: If the Loan Documents require hazard insurance and the Obligor has allowed the insurance coverage to lapse, Lenders should force-place insurance based on Prudent Servicing practices on a case-by-case basis. The cost of insurance that is forced-placed by a Lender is a Recoverable Expense.
proposition: If required hazard insurance lapses, the lender may buy coverage itself (force-place it) and recover the cost.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
