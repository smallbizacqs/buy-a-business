id: uscis-e2-marginal
tier: official-doc
title: "E-2 Treaty Investors: marginal enterprises"
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-2-treaty-investors
quote: The investment enterprise may not be marginal. A marginal enterprise is one that does not have the present or future capacity to generate more than enough income to provide a minimal living for the treaty investor and his or her family.
proposition: An E-2 business cannot be marginal, meaning it must be able to earn more than a minimal living for the investor and family.
accessed: 2026-11-26
