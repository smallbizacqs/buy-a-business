id: sba-sop-50-10-8-1-pari-passu
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.3: pari passu is not piggyback"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA does not consider a shared lien position with the lender (pari passu) to be a piggyback structure when the maturity of the non-SBA guaranteed loan is not shorter than the maturity of the SBA-guaranteed loan.
proposition: A non-SBA loan sharing the lien equally with the 7(a) loan is allowed if its maturity is not shorter than the 7(a) loan.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
