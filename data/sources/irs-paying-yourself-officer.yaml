title: Paying yourself
publisher: Internal Revenue Service
url: https://www.irs.gov/businesses/small-businesses-self-employed/paying-yourself
quote: Wages paid to you as an officer of a corporation should generally be commensurate with your duties.
proposition: An owner who is a corporate officer is generally an employee and should be paid wages in line with the work.
