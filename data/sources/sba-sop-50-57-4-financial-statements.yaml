id: sba-sop-50-57-4-financial-statements
tier: primary-rule
title: "SOP 50 57 4, Ch. 3: monitoring the borrower’s financial statements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2025-09/FINAL%20SOP%205057%204%20version.pdf
quote: If the Loan Documents require the Borrower to submit financial statements, Prudent Servicing practices require Lenders to request and, if provided, review and analyze the financial statements in a timely manner.
proposition: When the loan documents require periodic financial statements, the lender must request and review them in a timely way.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 57 4 (effective 2025-11-01) governs servicing and liquidation of 7(a) loans after disbursement.
