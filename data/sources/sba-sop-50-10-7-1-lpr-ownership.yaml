id: sba-sop-50-10-7-1-lpr-ownership
tier: primary-rule
title: "SOP 50 10 7.1 (effective November 15, 2023): businesses owned by non-U.S. citizens"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2023-10/SOP%2050%2010%207.1%20effective%2011.15.23.docx
quote: SBA can provide financial assistance to businesses that are at least 51% owned and controlled by persons who are not citizens of the U.S., provided the persons are Lawful Permanent Residents (LPRs) and comply with the requirements in this paragraph.
proposition: Under SOP 50 10 7.1, businesses owned and controlled by lawful permanent residents were eligible.
accessed: 2026-11-26
review_by: 2027-02-26
notes: Superseded; cited for the history of the rule.
