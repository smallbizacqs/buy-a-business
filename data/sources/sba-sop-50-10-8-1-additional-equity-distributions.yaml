id: sba-sop-50-10-8-1-additional-equity-distributions
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: equity beyond the injection"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Additional Equity Investments that are not used to meet the equity injection requirements, such as those providing additional liquidity, may receive standard distributions subject to any agreements of the Lender.
proposition: Investor money beyond the required injection may receive ordinary distributions, subject to the lender’s agreements.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
