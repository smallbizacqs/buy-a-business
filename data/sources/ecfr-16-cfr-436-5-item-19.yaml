id: ecfr-16-cfr-436-5-item-19
tier: primary-rule
title: "16 CFR 436.5(s): Item 19, Financial Performance Representations"
publisher: Federal Trade Commission (eCFR)
url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-D/part-436/section-436.5
quote: The FTC's Franchise Rule permits a franchisor to provide information about the actual or potential financial performance of its franchised and/or franchisor-owned outlets, if there is a reasonable basis for the information, and if the information is included in the disclosure document.
proposition: A franchisor may share financial performance figures only if they have a reasonable basis and appear in Item 19 of the disclosure document.
accessed: 2026-11-26
review_by: 2027-11-26
