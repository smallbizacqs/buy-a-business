id: irs-topic-409-holding-period
tier: official-doc
title: "Topic no. 409, Capital gains and losses: short-term or long-term"
publisher: Internal Revenue Service
url: https://www.irs.gov/taxtopics/tc409
quote: Generally, if you hold the asset for more than one year before you dispose of it, your capital gain or loss is long-term. If you hold it one year or less, your capital gain or loss is short-term.
proposition: A capital gain is generally long-term if the asset was held more than one year, and short-term if held one year or less.
accessed: 2026-11-26
review_by: 2027-02-26
