id: sba-sop-50-10-8-1-small-collateral
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 19: collateral for 7(a) Small loans"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For 7(a) Small Loans of $50,000 or less, collateral is not required. ... Lender must take a first lien on assets financed with loan proceeds, except where this Appendix does not require a lien on certain vehicles or permits a subordinate lien for improvements to existing assets.
proposition: A 7(a) Small loan of $50,000 or less needs no collateral; above that the lender must take a first lien on assets the loan finances, with limited exceptions.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
