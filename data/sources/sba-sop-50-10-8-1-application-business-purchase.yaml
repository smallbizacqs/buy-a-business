id: sba-sop-50-10-8-1-application-business-purchase
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 20: application documents for buying a business"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Copy of buy-sell or purchase and sales agreement; Copy of business valuation that meets the requirements in Appendix 15 Para. C.1.a. Business Valuation Requirements - Change of Ownership; Pro forma balance sheet for the business being purchased as of the date of transfer; Copy of seller’s financial statements for the last 3 complete fiscal years or for the number of years in business if less than 3 years."
proposition: "A 7(a) application to buy a business includes the purchase agreement, the business valuation, a pro forma balance sheet and three years of the seller's financial statements."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
