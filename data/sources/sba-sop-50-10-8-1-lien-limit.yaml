id: sba-sop-50-10-8-1-lien-limit
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.3: lien amount limits"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Liens on personal real estate may be limited to the amount of the collateral shortfall. In addition, liens on personal real estate may be limited to 150% of the equity in the collateral.
proposition: A lien on personal real estate may be limited to the collateral shortfall or to 150% of the equity.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
