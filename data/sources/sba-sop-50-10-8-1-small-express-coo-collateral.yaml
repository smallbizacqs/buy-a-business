id: sba-sop-50-10-8-1-small-express-coo-collateral
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: fully secured test for acquisitions under 7(a) Small and SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The loan must meet Appendix 15’s fully secured definition. However, unlike the general fully secured analysis, the lender is not required to include other held commercial real estate of the borrower or guarantors when determining if the loan is fully secured.
proposition: A 7(a) Small or SBA Express acquisition loan uses the Appendix 15 fully secured test, but the lender need not count other commercial real estate held by the borrower or guarantors.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
