id: sba-sop-50-10-8-1-professional-license-ownership
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 2: businesses needing professional licenses"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Businesses that offer services which require professional licenses to operate are eligible, provided that the ownership structure meets all applicable state requirements in which they are located."
proposition: "A business whose services require a professional license is SBA-eligible only if its ownership structure meets the state's requirements."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
