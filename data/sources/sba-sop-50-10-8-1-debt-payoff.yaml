id: sba-sop-50-10-8-1-debt-payoff
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: paying off the seller’s business debt"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Paying off existing business debt as part of an Initial Acquisition is not refinancing of debt under Appendix 14. The debt payoff must be included as part of the change of ownership transaction and must meet the requirements set forth in this Appendix."
proposition: "In an SBA initial acquisition, paying off the business's existing debt is part of the change-of-ownership transaction, not a separate refinancing."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
