id: sba-sop-50-10-8-1-express-purpose
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: purpose of SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The program reduces the number of government mandated forms and procedures, streamlines the processing, and reduces the cost of smaller, less complex SBA loans. The program allows Lenders to use, to the maximum extent practicable, their respective loan analyses, procedures, and documentation.
proposition: SBA Express is designed to cut government forms and procedures for smaller, less complex loans and lets lenders use their own analyses, procedures and documents.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
