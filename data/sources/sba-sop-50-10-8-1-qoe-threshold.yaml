id: sba-sop-50-10-8-1-qoe-threshold
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: Quality of Earnings required at $3 million"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For Business Expansion and Initial Acquisition transactions where the Purchase Price as defined in Paragraph A.1 is equal to or greater than $3 million, the Lender must also obtain a Quality of Earnings (QoE) in addition to the required Business Valuation. The $3 million threshold is determined before the application of buyer equity, seller debt, or other financing sources."
proposition: "For 7(a) initial acquisitions and business expansions with a business purchase price of $3 million or more, the lender must obtain a quality of earnings report as well as the business valuation, measured before equity, seller debt or other financing."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
