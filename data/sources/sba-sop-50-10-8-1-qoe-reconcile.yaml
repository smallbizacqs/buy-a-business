id: sba-sop-50-10-8-1-qoe-reconcile
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: what a QoE reconciles"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The QoE analysis must reconcile the business's accountant-prepared financial statements, tax returns, internal financial statements, and IRS transcript data to produce a normalized, adjusted earnings figure that reflects recurring, arm's-length operations."
proposition: "An SBA-required QoE reconciles the accountant-prepared statements, tax returns, internal statements and IRS transcripts into one normalized earnings figure."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
