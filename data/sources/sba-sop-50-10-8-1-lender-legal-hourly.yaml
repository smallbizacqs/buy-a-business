id: sba-sop-50-10-8-1-lender-legal-hourly
tier: primary-rule
title: "SOP 50 10 8.1, Section A: lender legal fees passed to the borrower"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "In accordance with 13 CFR § 120.221(e), charges for legal services must be charged on an hourly basis. The Lender or its Associate may not pass on to the Applicant/Borrower any cost of legal services not calculated on an hourly basis for services provided in connection with the Applicant/Borrower's transaction."
proposition: "Legal costs a 7(a) lender passes on to the borrower must be charged by the hour."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
