id: sba-sop-50-10-8-1-ineligible-divest
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: owners who are Ineligible Persons"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "If a direct or indirect owner is an Ineligible Person, the business is ineligible unless the Ineligible Person completely divests their ownership prior to the date of issuance of the SBA loan number. ... Six-month lookback: The Applicant business is ineligible if any direct or indirect owner of the business commencing 6 months prior to the date of issuance of the SBA loan number is an Ineligible Person"
proposition: A business with an Ineligible Person as owner, now or in the six months before the SBA loan number, is ineligible unless that person fully divests before the loan number is issued.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
