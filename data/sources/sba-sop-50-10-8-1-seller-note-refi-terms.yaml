id: sba-sop-50-10-8-1-seller-note-refi-terms
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: conditions to refinance a seller note"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "To be eligible for refinancing, any seller-financed Note must have been in place and current (not on standby) for at least 36 months following the change of ownership. The refinancing request must meet the SBA’s 10 percent improvement to installment payment amount requirement and must not reduce the Lender's exposure."
proposition: "A seller note can be refinanced with SBA financing only after 36 months in place and current, and the refinancing must improve the payment by at least 10 percent."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
