id: sba-7a-terms-fees-notice
tier: official-doc
title: "7(a) loan program terms, conditions and eligibility: fees"
publisher: U.S. Small Business Administration
url: https://www.sba.gov/partners/lenders/7a-loan-program/terms-conditions-eligibility
quote: Lenders must pay the Lender’s Annual Service Fee (also known as the SBA On-Going Guaranty Fee) based on the outstanding principal balance of the guaranteed portion of a loan at the time of SBA loan approval. This fee cannot be charged to the borrower. SBA publishes the amount of the Upfront Fee and the Lender’s Annual Service Fee each fiscal year for all loans approved during that year through an Information Notice.
proposition: SBA sets the 7(a) upfront and annual fees each fiscal year by Information Notice, and the annual fee cannot be charged to the borrower.
accessed: 2026-11-26
