title: "E-2 Treaty Investors: investment at risk"
publisher: U.S. Citizenship and Immigration Services
url: https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-2-treaty-investors
quote: investment is the treaty investor’s placing of capital, including funds and/or other assets, at risk in the commercial sense with the objective of generating a profit.
proposition: An E-2 investment means capital placed at commercial risk with the aim of making a profit.
