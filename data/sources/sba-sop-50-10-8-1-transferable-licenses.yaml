id: sba-sop-50-10-8-1-transferable-licenses
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: transferable licenses as collateral"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "With the exception of vehicles as described in Para. C.3.d.i., evidence that all assets, including transferable licenses (e.g., liquor license) conveyed as a result of purchase are properly secured as collateral by Lender."
proposition: "In an SBA change of ownership, the lender must take as collateral all assets conveyed, including transferable licenses such as a liquor license."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
