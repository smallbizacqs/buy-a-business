id: sba-sop-50-10-8-1-loc-alongside
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: working capital lines of credit"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: As part of the change of ownership transaction, the Borrower has the option to obtain a line of credit (conventional or government guaranteed) to support the working capital needs of the business.
proposition: A buyer may get a conventional or SBA-guaranteed working capital line alongside the acquisition loan.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
