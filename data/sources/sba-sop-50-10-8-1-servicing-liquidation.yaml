id: sba-sop-50-10-8-1-servicing-liquidation
tier: primary-rule
title: "SOP 50 10 8.1, Introduction: servicing and liquidation after disbursement"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Once an SBA Loan (defined as the full amount of the 7(a) loan or the Gross Debenture amount of the 504 loan) is disbursed, SBA Lenders must comply with the servicing and liquidation requirements in SOPs 50 57 (for 7(a) loans) and 50 55 (for 504 loans).
proposition: After a 7(a) loan is disbursed, servicing and liquidation (including handling a default) follow a separate SOP, 50 57.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
