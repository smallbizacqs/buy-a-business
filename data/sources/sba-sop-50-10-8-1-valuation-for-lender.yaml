id: sba-sop-50-10-8-1-valuation-for-lender
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: business valuation prepared for the lender"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For the individual performing the business valuation to identify the scope of work appropriately, the business valuation must be requested by and prepared for the Lender. The Lender may not use a business valuation prepared for the Applicant or the seller."
proposition: "The SBA business valuation must be ordered by and prepared for the lender; one prepared for the buyer or seller can't be used."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
