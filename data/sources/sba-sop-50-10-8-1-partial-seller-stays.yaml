id: sba-sop-50-10-8-1-partial-seller-stays
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: seller may stay in a partial change"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The seller may stay on as an owner, officer, director, stockholder, Key Employee, or employee of the business."
proposition: "In an SBA partial change of ownership (an owner buyout), the selling owner may stay on as an owner or employee."
