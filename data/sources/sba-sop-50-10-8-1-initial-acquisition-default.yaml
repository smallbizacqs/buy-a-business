id: sba-sop-50-10-8-1-initial-acquisition-default
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: types of changes of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Note: Initial Acquisition is the default category for 7(a) changes of ownership. For a change of ownership transaction to qualify as a Business Expansion, Owner Buyout, or ESOP & Cooperative, the Lender must document how the Applicant satisfies the requirement in their credit memorandum."
proposition: Initial Acquisition is the default SBA change-of-ownership category; the lender must document why a deal qualifies as anything else.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
