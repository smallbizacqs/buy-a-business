id: sba-sop-50-10-8-1-spouse-guaranty
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5, Para. A: guaranty of spouse"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Each spouse owning less than 20% of an Applicant must personally guarantee the loan in full when the combined ownership interest of both spouses and minor children is 20% or more.
proposition: A spouse owning under 20% must guarantee in full when spouses and minor children together own 20% or more.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
