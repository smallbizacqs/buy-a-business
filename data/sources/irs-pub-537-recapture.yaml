id: irs-pub-537-recapture
tier: official-doc
title: "Publication 537, Installment Sales: depreciation recapture"
publisher: Internal Revenue Service
url: https://www.irs.gov/publications/p537
quote: If you sell property for which you claimed or could have claimed a depreciation deduction, you must report any depreciation recapture income in the year of sale, whether or not an installment payment was received that year.
proposition: Depreciation recapture is reported in the year of sale even in an installment sale.
accessed: 2026-11-26
review_by: 2027-02-26
