id: sba-sop-50-10-8-1-small-express-coo
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: changes of ownership under 7(a) Small and SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "For changes of ownership financed utilizing 7(a) Small and SBA Express the following Appendix 15 modifications apply: ... All other applicable Appendix 15 change of ownership requirements continue to apply unless Appendix 15 expressly provides otherwise."
proposition: A business purchase financed with a 7(a) Small or SBA Express loan follows the Appendix 15 change-of-ownership rules, with only the listed modifications.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
