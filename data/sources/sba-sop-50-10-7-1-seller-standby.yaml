id: sba-sop-50-10-7-1-seller-standby
tier: primary-rule
title: "SOP 50 10 7.1 (effective November 15, 2023): seller debt as equity"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2023-10/SOP%2050%2010%207.1%20effective%2011.15.23.docx
quote: "Seller debt may not be considered as part of the equity injection unless either: It is on full standby for the first 24 months of the 7(a) loan; or A debt that is on partial standby (interest payments only being made) may be considered equity when there is historical business cash flow available to make the payments, and at least a quarter of the SBA-required equity injection is from a source other than the seller."
proposition: Under SOP 50 10 7.1, seller debt could count as equity on full standby for 24 months, or on partial standby with interest-only payments.
accessed: 2026-11-26
review_by: 2027-02-26
notes: Superseded; cited for the history of the rule.
