id: sba-sop-50-10-8-1-six-month-lookback
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: six-month lookback rule"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Any Person (as defined in 13 CFR 120.10) subject to the guaranty requirements 6 months prior to the date of the loan application would continue to be subject to the requirements even if that Person has changed their ownership interest to less than 20%.
proposition: Someone who owned 20% or more within six months before the application still must guarantee even after cutting below 20%.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
