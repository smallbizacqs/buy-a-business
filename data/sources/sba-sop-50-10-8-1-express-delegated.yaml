id: sba-sop-50-10-8-1-express-delegated
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: SBA Express credit decision"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: SBA Express loans are only processed via an SBA Express Lender’s delegated authority. ... SBA has authorized SBA Express Lenders to make the credit decision without prior SBA review.
proposition: SBA Express loans are processed only under the lender’s delegated authority, and the lender makes the credit decision without prior SBA review.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
