id: sba-sop-50-10-8-1-business-expansion-equity
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: equity for Business Expansions and Owner Buyouts"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Business Expansion, Owner Buyouts, and ESOP & Cooperatives: 10% For both Business Expansions and Owner Buyouts, the Lender may reduce or eliminate this requirement if they have determined that the Borrower has sufficient liquidity and working capital to sustain operations following the transaction."
proposition: For a Business Expansion the equity injection is 10%, which the lender may reduce or eliminate if the borrower has enough liquidity and working capital.
accessed: 2026-11-26
