quote: "The purpose of SBA's Tax Verification process is to determine if: ... The Applicant's financial statements provided as part of the application agree with the business tax returns submitted to the IRS."
proposition: "SBA's tax verification checks whether the financial statements given to the lender agree with the tax returns filed with the IRS."
