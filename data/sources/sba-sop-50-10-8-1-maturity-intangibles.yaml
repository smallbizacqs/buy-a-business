id: sba-sop-50-10-8-1-maturity-intangibles
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 17: 7(a) loan maturity requirements"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Working capital or inventory loans and the financing of intangible assets (including goodwill) must not exceed 10 years.
proposition: Under SBA rules, loans for working capital, inventory or intangible assets such as goodwill may not exceed 10 years.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
