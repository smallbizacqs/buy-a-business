id: sba-sop-50-10-8-1-franchise-directory
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1, Para. G: SBA Franchise Directory"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: If the Applicant’s brand meets the FTC definition of a franchise, it must be on the Directory in order to obtain SBA financing.
proposition: A business operating under a brand that meets the FTC franchise definition can get SBA financing only if the brand is on the SBA Franchise Directory.
