title: "17 CFR 230.501: Accredited investor: primary residence excluded"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: The person's primary residence shall not be included as an asset;
proposition: For the $1 million net worth test, the primary residence is not counted as an asset.
