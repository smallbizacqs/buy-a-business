id: sba-sop-50-10-8-1-conditions-before-disbursement
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 6: conditions before disbursement"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "The Lender must obtain all required collateral and must meet all other required terms and conditions as applicable before or at the time of disbursement. Required terms and conditions include requirements identified in the credit memorandum, such as cash/equity injections, standby agreements, appraisals or evaluations, etc."
proposition: "Before or at disbursement the lender must have its collateral and every condition in its credit memo met, such as the equity injection, standby agreements and appraisals."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
