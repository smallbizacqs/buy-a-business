id: sba-sop-50-10-8-1-504-change-of-ownership
tier: primary-rule
title: "SOP 50 10 8.1, Section C: 504 change of ownership"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The 504 Project finances only the costs associated with eligible long-term fixed assets; the acquisition of any other assets such as receivables or goodwill is not an eligible use of 504 loan proceeds or Third Party Loan proceeds and must be financed by other means, which may include a 7(a) loan; The application documents that jobs will be created or retained because of the change of ownership.
proposition: In a business purchase, 504 funds only long-term fixed assets; goodwill and receivables must be financed another way, such as a 7(a) loan, and the application must show jobs created or retained.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
