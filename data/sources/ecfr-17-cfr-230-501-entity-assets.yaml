id: ecfr-17-cfr-230-501-entity-assets
tier: primary-rule
title: "17 CFR 230.501(a)(3): entities with more than $5 million in assets"
publisher: U.S. Securities and Exchange Commission (eCFR)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: corporation, Massachusetts or similar business trust, partnership, or limited liability company, not formed for the specific purpose of acquiring the securities offered, with total assets in excess of $5,000,000;
proposition: A corporation, partnership or LLC with total assets over $5 million, not formed to buy the securities, is an accredited investor.
