id: ecfr-40-cfr-312-20-aai
tier: primary-rule
title: "40 CFR 312.20: All Appropriate Inquiries"
publisher: Environmental Protection Agency (eCFR)
url: https://www.ecfr.gov/current/title-40/chapter-I/subchapter-J/part-312/section-312.20
quote: "“All appropriate inquiries” pursuant to CERCLA section 101(35)(B) must be conducted within one year prior to the date of acquisition of the subject property and must include: (1) An inquiry by an environmental professional"
proposition: All Appropriate Inquiries must be done within one year before acquiring the property and include an inquiry by an environmental professional.
