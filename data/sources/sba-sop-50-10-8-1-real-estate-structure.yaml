id: sba-sop-50-10-8-1-real-estate-structure
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: real estate in an acquisition"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Only the portion of the real estate purchase may have an amortization that exceeds 10-years, up to a maximum of a 25-year term. All other uses of proceeds, including those related to soft costs and working capital, must be allocated a 10-year term."
proposition: "When an SBA acquisition loan also buys real estate, only the real estate portion may amortize longer than 10 years, up to 25; everything else gets 10 years."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
