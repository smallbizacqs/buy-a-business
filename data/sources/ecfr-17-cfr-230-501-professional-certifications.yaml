id: ecfr-17-cfr-230-501-professional-certifications
tier: primary-rule
title: "17 CFR 230.501(a)(10): professional certifications"
publisher: U.S. Securities and Exchange Commission (eCFR)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: Any natural person holding in good standing one or more professional certifications or designations or credentials from an accredited educational institution that the Commission has designated as qualifying an individual for accredited investor status. ... The professional certifications or designations or credentials currently recognized by the Commission as satisfying the above criteria will be posted on the Commission's website.
proposition: A person holding a professional certification the SEC has designated is an accredited investor; the SEC posts the designated list on its website.
accessed: 2026-11-26
review_by: 2027-02-26
