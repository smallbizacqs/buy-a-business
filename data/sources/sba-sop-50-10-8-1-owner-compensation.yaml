id: sba-sop-50-10-8-1-owner-compensation
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.b: owner compensation"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The ownership compensation of the Applicant must be sufficient to support their current obligations and living expenses.
proposition: The buyer’s pay from the business must cover their personal obligations and living expenses.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
