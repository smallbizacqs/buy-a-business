id: sba-sop-50-10-8-1-ineligible-limited-guaranty
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 1: limited guaranties by Ineligible Persons"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: When a limited or supplemental guaranty is required by the Lender for their approval, or by SBA to support the pledge of jointly held required collateral, an Ineligible Person (except for undocumented aliens who are in the U.S. illegally) may provide a limited guaranty.
proposition: An Ineligible Person may give a limited guaranty when the lender requires one or to support jointly held collateral.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
