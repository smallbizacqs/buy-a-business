id: ecfr-17-cfr-230-506-b-purchasers
tier: primary-rule
title: "17 CFR 230.506: Rule 506(b) number of purchasers"
publisher: U.S. Securities and Exchange Commission (eCFR, Office of the Federal Register)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.506
quote: There are no more than, or the issuer reasonably believes that there are no more than, 35 purchasers of securities from the issuer in offerings under this section in any 90-calendar-day period.
proposition: Rule 506(b) limits an offering to 35 purchasers in any 90 days, counted as Rule 501(e) provides.
accessed: 2026-11-26
review_by: 2027-02-26
