id: sba-sop-50-10-8-1-real-estate-separate-or-blended
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: change of ownership with real estate"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: Separate loans, one for the change of ownership and one for real estate (including the 504 program) and must comply with the requirements in Para. C.3.c.; or Blended on a weighted average basis, rounded to the nearest full year. ... The SBA 504 program is not eligible for use on a blended basis.
proposition: When an SBA acquisition includes real estate, it is financed as separate loans (one may be a 504) or as one blended 7(a) loan; a 504 cannot be blended.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
