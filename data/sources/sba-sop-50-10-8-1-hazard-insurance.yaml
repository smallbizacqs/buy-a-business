id: sba-sop-50-10-8-1-hazard-insurance
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 4: hazard insurance"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: For 7(a) loans greater than $50,000, and for 504 projects greater than $50,000, SBA requires hazard insurance on all assets pledged as collateral.
proposition: For 7(a) loans over $50,000, SBA requires hazard insurance on all collateral.
