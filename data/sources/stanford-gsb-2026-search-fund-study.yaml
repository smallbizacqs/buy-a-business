quote: The 2026 Search Fund Study reports on the financial returns and key characteristics of search funds formed in the United States and Canada since 1984. This report updates the previous 2024 study with data through December 31, 2025. The report also introduces data on 67 long duration enterprises.
proposition: Stanford GSB publishes a periodic study of search fund returns; the 2026 edition covers US and Canadian funds since 1984 with data through 2025, and adds data on long-duration enterprises.
