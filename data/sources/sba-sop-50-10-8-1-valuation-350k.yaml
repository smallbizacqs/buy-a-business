id: sba-sop-50-10-8-1-valuation-350k
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: lender may value deals of $350,000 or less"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "If the Business Purchase Price is $350,000 or less, the Lender may perform its own valuation of the business being sold, unless there is a close relationship between the buyer and seller."
proposition: "For a business purchase price of $350,000 or less, the lender may do its own valuation instead of using an outside qualified source, unless buyer and seller are closely related."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
