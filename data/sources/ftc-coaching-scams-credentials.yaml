id: ftc-coaching-scams-credentials
tier: official-doc
title: "When a Business Offer or Coaching Program Is a Scam: credentials"
publisher: Federal Trade Commission
url: https://consumer.ftc.gov/articles/when-business-offer-or-coaching-program-scam
quote: There’s no licensing requirement to become a business coach, but there are some certification programs. Business coaching scammers often lie about their credentials.
proposition: Business coaches need no license, and the FTC advises checking a coach's claimed credentials and talking to former and current students.
