title: "Rollovers as business start-ups compliance project: results"
publisher: Internal Revenue Service
url: https://www.irs.gov/retirement-plans/rollovers-as-business-start-ups-compliance-project
quote: Results from the ROBS Project indicated that, although there were some success stories, most ROBS businesses either failed or were on the road to failure with high rates of bankruptcy (business and personal), liens (business and personal), and corporate dissolutions by individual Secretaries of State.
proposition: The IRS compliance project found most ROBS businesses it reviewed had failed or were failing.
