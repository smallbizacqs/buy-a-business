id: sba-sop-50-10-8-1-fee-itemization
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 1: fees the lender may collect"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The Lender must advise the Applicant in writing that the Applicant is not required to obtain or pay for unwanted services. The Lender must itemize for the Applicant in writing any fees charged in association with the 7(a) loan.
proposition: A 7(a) lender must itemize its fees in writing and tell the applicant it need not pay for unwanted services.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
