id: sba-sop-50-10-8-1-504-structure
tier: primary-rule
title: "SOP 50 10 8.1, Section C: 504 project structure"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "A 504 project has three main partners and generally: a Third Party Lender provides 50% or more of the financing; a Certified Development Company (CDC) provides up to 40% of the financing through a 504 debenture (guaranteed 100% by SBA); and an applicant (Borrower) injects at least 10% of the financing"
proposition: A 504 project generally combines a third-party lender loan of 50% or more, a CDC debenture of up to 40%, and at least 10% from the borrower.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
