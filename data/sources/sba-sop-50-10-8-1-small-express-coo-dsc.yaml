id: sba-sop-50-10-8-1-small-express-coo-dsc
tier: primary-rule
title: "SOP 50 10 8.1, Section B, Ch. 2: debt service coverage for acquisitions under 7(a) Small and SBA Express"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: No reduced or alternative DSC standard applies solely because the loan is a 7(a) Small or SBA Express loan.
proposition: A 7(a) Small or SBA Express acquisition loan must meet the same debt service coverage standard as any other change of ownership.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
