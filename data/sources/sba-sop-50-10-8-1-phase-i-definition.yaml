id: sba-sop-50-10-8-1-phase-i-definition
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 4: definition of Phase I ESA"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: “Phase I Environmental Site Assessment” (Phase I ESA) means an AAI compliant Phase I ESA conducted by an Environmental Professional in accordance with the most recently adopted standard for a Phase I ESA established by ASTM International, currently ASTM E1527-21.
proposition: For SBA purposes a Phase I is an All Appropriate Inquiries-compliant assessment by an environmental professional under the current ASTM standard (E1527-21).
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review.
