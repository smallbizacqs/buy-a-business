id: sba-sop-50-10-8-1-initial-acquisition-definition
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15: initial acquisition defined"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Initial Acquisition: A change of ownership transaction that results in a new majority or largest individual owner who was not previously a direct or indirect owner, or an individual who has been employed for fewer than 24 months by the business being acquired."
proposition: "An initial acquisition is a deal that makes a newcomer (or someone employed under 24 months) the majority or largest owner."
accessed: 2026-11-26
review_by: 2027-02-26
notes: "SOP 50 10 8.1 (effective October 1, 2026). Re-check against the current SOP on review."
