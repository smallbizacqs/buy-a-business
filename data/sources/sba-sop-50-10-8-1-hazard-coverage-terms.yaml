id: sba-sop-50-10-8-1-hazard-coverage-terms
tier: primary-rule
title: "SOP 50 10 8.1, Section A, Ch. 5: hazard insurance coverage terms"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: The Borrower must also maintain a separate policy if the business is located in a state that requires additional coverage such as wind, hail, earthquake, or other. ... Coverage must be in the amount of the full replacement cost. ... Insurance coverage must contain a LENDER'S LOSS PAYABLE CLAUSE (or substantial equivalent) in favor of the 7(a) Lender (for 7(a)) ... The policy or endorsements must provide for at least 10 days prior written notice to the 7(a) Lender (for 7(a)), or the CDC/SBA (for 504), of policy cancellation.
proposition: Required hazard insurance must cover full replacement cost, name the lender as loss payee, give the lender at least 10 days’ notice of cancellation, and be supplemented where the state requires added coverage such as wind or earthquake.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
