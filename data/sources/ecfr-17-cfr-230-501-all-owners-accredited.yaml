id: ecfr-17-cfr-230-501-all-owners-accredited
tier: primary-rule
title: "17 CFR 230.501(a)(8): entities owned by accredited investors"
publisher: U.S. Securities and Exchange Commission (eCFR)
url: https://www.ecfr.gov/current/title-17/chapter-II/part-230/section-230.501
quote: Any entity in which all of the equity owners are accredited investors;
proposition: An entity whose equity owners are all accredited investors is itself accredited.
