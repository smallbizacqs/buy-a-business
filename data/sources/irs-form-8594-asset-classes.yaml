id: irs-form-8594-asset-classes
tier: official-doc
title: "Instructions for Form 8594: classes of assets"
publisher: Internal Revenue Service
url: https://www.irs.gov/instructions/i8594
quote: Class I assets are cash and general deposit accounts (including savings and checking accounts) other than certificates of deposit held in banks, savings and loan associations, and other depository institutions. ... Class III assets are assets that the taxpayer marks to market at least annually for federal income tax purposes and debt instruments (including accounts receivable). ... Class IV assets are stock in trade of the taxpayer or other property of a kind that would properly be included in the inventory of the taxpayer ... Furniture and fixtures, buildings, land, vehicles, and equipment that constitute all or part of a trade or business (defined earlier) are generally Class V assets. Class VI assets are all section 197 intangibles (as defined in section 197) except goodwill and going concern value.
proposition: "Form 8594 sorts assets into classes: cash is Class I, receivables are Class III, inventory is Class IV, equipment, vehicles, furniture and real property are generally Class V, and section 197 intangibles other than goodwill are Class VI."
accessed: 2026-11-26
