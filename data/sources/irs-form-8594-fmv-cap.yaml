id: irs-form-8594-fmv-cap
tier: official-doc
title: "Instructions for Form 8594: allocation limited to fair market value"
publisher: Internal Revenue Service
url: https://www.irs.gov/instructions/i8594
quote: "The amount allocated to an asset, other than a Class VII asset, cannot exceed its fair market value on the purchase date."
proposition: "Under the residual method, no asset other than goodwill and going concern value (Class VII) can be allocated more than its fair market value on the purchase date."
accessed: 2026-11-26
review_by: 2027-02-26
