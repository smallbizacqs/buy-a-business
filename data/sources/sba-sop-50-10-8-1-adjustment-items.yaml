id: sba-sop-50-10-8-1-adjustment-items
tier: primary-rule
title: "SOP 50 10 8.1, Appendix 15, Para. C.2.b: adjusted DSC items"
publisher: U.S. Small Business Administration
url: https://legacy.sba.gov/sites/default/files/2026-10/SOP%2050%2010%208.1%20Technical%20Policy%20Updates%20effective%20%2010.1.2026.docx
quote: "Justification for additions and subtractions to cash flow, such as the following: Unfunded capital expenditures; Non-recurring income; Distributions; Distributions for S-Corp taxes; Seller discretionary expenses; and/or Ownership Compensation."
proposition: Adjustments to cash flow the lender may justify include unfunded capex, non-recurring income, distributions, S-corp tax distributions, seller discretionary expenses and owner compensation.
accessed: 2026-11-26
review_by: 2027-02-26
notes: SOP 50 10 8.1 applies to loans given an SBA loan number on or after 2026-10-01.
