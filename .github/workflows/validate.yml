name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Private terms list (from a repository secret; the scan warns if it is absent)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: if [ -n "$PRIVATE_TERMS" ]; then printf '%s\n' "$PRIVATE_TERMS" > .private-terms; fi
      - run: npm run validate
      - run: npm test
      - run: node --test skills/*/scripts/ || [ -z "$(ls skills/*/scripts/*.test.mjs 2>/dev/null)" ]
      - run: node scripts/generate.mjs --check
